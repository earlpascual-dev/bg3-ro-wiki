<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geffen Codex</title>
  <style>
/* ==========================================================================
   Geffen Codex — BG3 build wiki
   Ragnarok Online window aesthetic, built from scratch in pure CSS.
   No game assets, no sprites, no external fonts, no CDN. Fully offline.
   ========================================================================== */

:root {
  /* RO window chrome */
  --ro-frame:        #b9c2ce;
  --ro-frame-light:  #eef2f7;
  --ro-frame-dark:   #6c7686;
  --ro-frame-darker: #454d5a;

  /* Title bars */
  --ro-title-top:    #4a6da3;
  --ro-title-bot:    #223c66;
  --ro-title-text:   #ffffff;

  /* Parchment content */
  --ro-parch:        #ece0c4;
  --ro-parch-alt:    #e2d3b0;
  --ro-parch-border: #8a6a42;
  --ro-ink:          #34291c;
  --ro-ink-soft:     #6a5942;

  /* Accents */
  --ro-gold:         #f2c14e;
  --ro-gold-deep:    #a97b1b;
  --ro-red:          #a32b2b;
  --ro-green:        #2f7d32;

  /* Class colours */
  --c-sniper:        #3f8f45;
  --c-assassin:      #7c1f2b;
  --c-priest:        #d9c98a;
  --c-crusader:      #2f5f9e;
  --c-wizard:        #6b3fa0;

  --app-bg:          #2b3140;
  --font-stack:      "Lucida Console", "Courier New", Consolas, "DejaVu Sans Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--app-bg);
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size: 4px 4px, 4px 4px;
  color: var(--ro-ink);
  font-family: var(--font-stack);
  font-size: 13px;
  line-height: 1.55;
}

img, canvas { image-rendering: pixelated; }

a { color: #1d4f8f; }
a:hover { color: var(--ro-red); }

/* ---------- Generic RO window ---------- */
.ro-window {
  background: var(--ro-frame);
  border: 2px outset var(--ro-frame-light);
  border-right-color: var(--ro-frame-dark);
  border-bottom-color: var(--ro-frame-dark);
  box-shadow: 2px 2px 0 rgba(0,0,0,.45);
  margin-bottom: 14px;
}

.ro-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, var(--ro-title-top), var(--ro-title-bot));
  border-bottom: 2px solid var(--ro-frame-darker);
  color: var(--ro-title-text);
  padding: 4px 6px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
  text-transform: uppercase;
}

.ro-titlebar .ro-close {
  width: 12px;
  height: 12px;
  flex: 0 0 12px;
  background: var(--ro-frame);
  border: 2px outset var(--ro-frame-light);
  border-right-color: var(--ro-frame-dark);
  border-bottom-color: var(--ro-frame-dark);
}

.ro-body { padding: 8px; }

/* Parchment text block */
.parch {
  background: var(--ro-parch);
  background-image: linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,.04));
  border: 1px solid var(--ro-parch-border);
  padding: 8px 10px;
  color: var(--ro-ink);
}
.parch + .parch { margin-top: 8px; }
.parch.alt { background: var(--ro-parch-alt); }

/* ---------- Layout ---------- */
.app-shell {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 14px;
  max-width: 1240px;
  margin: 0 auto;
  padding: 14px;
}

.masthead {
  max-width: 1240px;
  margin: 0 auto;
  padding: 14px 14px 0;
}
.masthead h1 {
  margin: 0;
  font-size: 17px;
  color: var(--ro-gold);
  text-shadow: 2px 2px 0 #000;
  letter-spacing: 1px;
}
.masthead p {
  margin: 3px 0 0;
  color: #b6c0d0;
  font-size: 11px;
}

.sidebar { position: sticky; top: 14px; align-self: start; }

/* ---------- Nav ---------- */
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list li { margin-bottom: 3px; }

.nav-list a {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 7px;
  background: var(--ro-parch);
  border: 1px solid var(--ro-parch-border);
  color: var(--ro-ink);
  text-decoration: none;
  font-size: 12px;
}
.nav-list a:hover { background: #f7eed6; }
.nav-list a.active {
  background: linear-gradient(180deg, var(--ro-title-top), var(--ro-title-bot));
  color: #fff;
  border-color: var(--ro-frame-darker);
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}
.nav-section {
  margin: 9px 0 4px;
  color: var(--ro-frame-darker);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--ro-frame-dark);
}

/* ---------- Search ---------- */
.search-box {
  width: 100%;
  padding: 5px 6px;
  font-family: var(--font-stack);
  font-size: 12px;
  background: #fbf6e6;
  border: 2px inset var(--ro-frame-dark);
  color: var(--ro-ink);
}
.search-box:focus { outline: 1px solid var(--ro-gold); }

.search-results { margin-top: 8px; }
.search-hit {
  background: var(--ro-parch);
  border: 1px solid var(--ro-parch-border);
  padding: 6px 8px;
  margin-bottom: 5px;
  cursor: pointer;
}
.search-hit:hover { background: #f7eed6; }
.search-hit .hit-kind {
  color: var(--ro-gold-deep);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.search-hit .hit-title { font-weight: bold; }
.search-hit .hit-snip { color: var(--ro-ink-soft); font-size: 11px; }

mark { background: var(--ro-gold); color: #000; padding: 0 1px; }

/* ---------- Badges ---------- */
.badge {
  display: inline-block;
  padding: 1px 7px;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 1px solid rgba(0,0,0,.55);
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0,0,0,.7);
  vertical-align: middle;
}
.badge.sniper   { background: var(--c-sniper); }
.badge.assassin { background: var(--c-assassin); }
.badge.priest   { background: var(--c-priest); color: #3a2f10; text-shadow: none; border-color: var(--ro-gold-deep); }
.badge.crusader { background: var(--c-crusader); }
.badge.wizard   { background: var(--c-wizard); }
.badge.party    { background: #5a5f6e; }

.warn-badge {
  display: inline-block;
  padding: 1px 6px;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: .5px;
  text-transform: uppercase;
  background: repeating-linear-gradient(45deg, #c9a227, #c9a227 5px, #1c1c1c 5px, #1c1c1c 10px);
  color: #fff;
  border: 1px solid #000;
  text-shadow: 1px 1px 0 #000;
}
.miss-badge {
  display: inline-block;
  padding: 1px 6px;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  background: var(--ro-red);
  color: #fff;
  border: 1px solid #000;
}

/* ---------- Headers ---------- */
h2.ro-h {
  margin: 0 0 8px;
  font-size: 14px;
  color: var(--ro-gold-deep);
  border-bottom: 2px solid var(--ro-gold-deep);
  padding-bottom: 3px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
h3.ro-h3 {
  margin: 12px 0 6px;
  font-size: 12px;
  color: #24406b;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-left: 4px solid var(--ro-gold);
  padding-left: 6px;
}

/* ---------- Stat block ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 6px;
}
.stat-cell {
  background: var(--ro-parch);
  border: 1px solid var(--ro-parch-border);
  border-top-color: #fff8e2;
  border-left-color: #fff8e2;
  padding: 5px 7px;
  text-align: center;
}
.stat-cell .s-name {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--ro-ink-soft);
  text-transform: uppercase;
}
.stat-cell .s-val {
  font-size: 21px;
  font-weight: bold;
  color: var(--ro-gold-deep);
  text-shadow: 1px 1px 0 #fff8e2;
  line-height: 1.1;
}
.stat-cell .s-mod { font-size: 10px; color: var(--ro-ink-soft); }
.stat-note {
  font-size: 11px;
  color: var(--ro-ink-soft);
  margin-top: 3px;
  text-align: left;
  line-height: 1.4;
}

/* ---------- Skill tree (level rows) ---------- */
.skilltree { position: relative; padding-left: 22px; margin-top: 6px; }
.skilltree::before {
  content: "";
  position: absolute;
  left: 8px; top: 10px; bottom: 10px;
  width: 2px;
  background: var(--ro-frame-dark);
}

.skillnode { position: relative; margin-bottom: 8px; }
.skillnode::before {
  content: "";
  position: absolute;
  left: -14px; top: 14px;
  width: 12px; height: 2px;
  background: var(--ro-frame-dark);
}
.skillnode::after {
  content: "";
  position: absolute;
  left: -18px; top: 11px;
  width: 8px; height: 8px;
  background: var(--ro-gold);
  border: 1px solid #000;
}

.skillbox {
  background: var(--ro-frame);
  border: 2px outset var(--ro-frame-light);
  border-right-color: var(--ro-frame-dark);
  border-bottom-color: var(--ro-frame-dark);
  padding: 0;
}
.skillbox.locked { border-left: 4px solid var(--ro-red); }

.skillbox-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: linear-gradient(180deg, #cfd7e2, #aeb8c6);
  border-bottom: 1px solid var(--ro-frame-dark);
  padding: 3px 6px;
}
.lvl-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  padding: 1px 5px;
  background: linear-gradient(180deg, var(--ro-title-top), var(--ro-title-bot));
  color: #fff;
  border: 1px solid #0e1c33;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}
.menu-label { font-size: 11px; color: #2a3242; }

.skillbox-body { padding: 7px 8px; }
.pick-line {
  background: #1f2a1f;
  color: #b7f0a8;
  border: 1px solid #0d140d;
  padding: 4px 7px;
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 6px;
}
.reason { margin: 0 0 6px; }

.alts {
  background: var(--ro-parch-alt);
  border: 1px dashed var(--ro-parch-border);
  padding: 5px 8px;
  font-size: 11px;
  color: var(--ro-ink-soft);
}
.alts strong { color: var(--ro-ink); }
.alts ul { margin: 3px 0 0; padding-left: 16px; }

.details-list { margin: 6px 0 0; padding-left: 16px; font-size: 11.5px; }
.details-list li { margin-bottom: 4px; }

/* ---------- Inventory slot grid (gear) ---------- */
.slot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 8px;
}

.slot-tile {
  background: var(--ro-frame);
  border: 2px outset var(--ro-frame-light);
  border-right-color: var(--ro-frame-dark);
  border-bottom-color: var(--ro-frame-dark);
  display: flex;
  flex-direction: column;
}
.slot-tile .tile-top {
  display: flex;
  gap: 7px;
  padding: 6px;
  border-bottom: 1px solid var(--ro-frame-dark);
  background: linear-gradient(180deg, #cfd7e2, #b4bdca);
}
/* RO-style inventory slot: dark inset well, icon tinted by its wearer */
.tile-icon {
  width: 34px; height: 34px;
  flex: 0 0 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, #2d3444, #171c26);
  border: 2px inset #6c7686;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  color: #cfd7e2;
}
.tile-icon svg {
  width: 24px; height: 24px;
  display: block;
  fill: currentColor;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.7));
}
.tile-icon.w-main        { color: #6fd07a; }
.tile-icon.w-astarion    { color: #e8737f; }
.tile-icon.w-shadowheart { color: #f2d98a; }
.tile-icon.w-paladin     { color: #7fb2ee; }
.tile-icon.w-gale        { color: #b98ce8; }

.tile-name { font-weight: bold; font-size: 12px; color: #1c2433; line-height: 1.3; }
.tile-slot { font-size: 10px; color: #465061; text-transform: uppercase; letter-spacing: 1px; }

.slot-tile .tile-body { padding: 7px; background: var(--ro-parch); flex: 1; }
.tile-row { font-size: 11.5px; margin-bottom: 4px; }
.tile-row .k {
  display: inline-block;
  min-width: 62px;
  color: var(--ro-gold-deep);
  font-weight: bold;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: .5px;
}
.tile-note {
  margin-top: 6px;
  padding-top: 5px;
  border-top: 1px dashed var(--ro-parch-border);
  font-size: 11px;
  color: var(--ro-ink-soft);
}

/* ---------- Filters ---------- */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  margin-bottom: 10px;
}
.filterbar .flabel {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ro-frame-darker);
  margin-right: 2px;
}
.fbtn {
  font-family: var(--font-stack);
  font-size: 11px;
  padding: 3px 9px;
  cursor: pointer;
  background: var(--ro-frame);
  border: 2px outset var(--ro-frame-light);
  border-right-color: var(--ro-frame-dark);
  border-bottom-color: var(--ro-frame-dark);
  color: #1c2433;
}
.fbtn:hover { background: #cbd3de; }
.fbtn.on {
  border-style: inset;
  background: linear-gradient(180deg, var(--ro-title-top), var(--ro-title-bot));
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}

/* ---------- Rotations ---------- */
.rot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 8px;
}
.rot-col { background: var(--ro-parch); border: 1px solid var(--ro-parch-border); }
.rot-col h4 {
  margin: 0;
  padding: 4px 7px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
}
.rot-col.pre    h4 { background: #4a5a6d; }
.rot-col.opener h4 { background: var(--ro-green); }
.rot-col.sustain h4 { background: #2f5f9e; }
.rot-col.panic  h4 { background: var(--ro-red); }
.rot-col ol, .rot-col ul { margin: 0; padding: 7px 7px 7px 24px; font-size: 11.5px; }
.rot-col li { margin-bottom: 5px; }

/* ---------- Checklist ---------- */
.progress-wrap {
  background: #22262f;
  border: 2px inset var(--ro-frame-dark);
  height: 17px;
  position: relative;
  margin-bottom: 4px;
}
.progress-bar {
  height: 100%;
  background: repeating-linear-gradient(90deg, #ffe27a 0 6px, #e8b62c 6px 12px);
  transition: width .18s linear;
}
.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: bold;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
  letter-spacing: 1px;
}

.task {
  display: flex;
  gap: 8px;
  background: var(--ro-parch);
  border: 1px solid var(--ro-parch-border);
  padding: 7px 8px;
  margin-bottom: 5px;
  cursor: pointer;
}
.task:hover { background: #f7eed6; }
.task.done { opacity: .5; background: #d8d2c0; }
.task.done .task-title { text-decoration: line-through; }

.task-check {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  margin-top: 2px;
  background: #fbf6e6;
  border: 2px inset var(--ro-frame-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  color: var(--ro-green);
  line-height: 1;
}
.task-order {
  color: var(--ro-gold-deep);
  font-weight: bold;
  margin-right: 5px;
}
.task-title { font-weight: bold; font-size: 12.5px; }
.task-meta { font-size: 11px; color: var(--ro-ink-soft); margin-top: 3px; }
.task-warn {
  margin-top: 5px;
  background: #f6e2c0;
  border-left: 4px solid var(--ro-red);
  padding: 4px 7px;
  font-size: 11px;
  color: #6a2020;
}
.task-detail { margin-top: 5px; font-size: 11.5px; }

/* ---------- Misc ---------- */
.kv-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.kv-table th, .kv-table td {
  border: 1px solid var(--ro-parch-border);
  padding: 4px 6px;
  text-align: left;
  vertical-align: top;
}
.kv-table th {
  background: linear-gradient(180deg, var(--ro-title-top), var(--ro-title-bot));
  color: #fff;
  text-shadow: 1px 1px 0 rgba(0,0,0,.6);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.kv-table tr:nth-child(even) td { background: var(--ro-parch-alt); }
.kv-table td { background: var(--ro-parch); }
.table-scroll { overflow-x: auto; }

.note-strip {
  background: #f6e2c0;
  border: 1px solid var(--ro-parch-border);
  border-left: 4px solid var(--ro-gold-deep);
  padding: 6px 9px;
  font-size: 11.5px;
  margin-bottom: 8px;
}
.break-strip {
  background: #efdcdc;
  border: 1px solid #a37272;
  border-left: 4px solid var(--ro-red);
  padding: 6px 9px;
  font-size: 11.5px;
  margin-bottom: 6px;
}
.break-strip .bl {
  color: var(--ro-red);
  font-weight: bold;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 1px;
}

.char-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 8px;
}
.char-card {
  background: var(--ro-parch);
  border: 1px solid var(--ro-parch-border);
  padding: 8px;
  text-decoration: none;
  color: var(--ro-ink);
  display: block;
}
.char-card:hover { background: #f7eed6; }
.char-card .cc-name { font-size: 14px; font-weight: bold; color: #24406b; }
.char-card .cc-build { font-size: 11px; color: var(--ro-gold-deep); font-weight: bold; }
.char-card .cc-role { font-size: 11px; color: var(--ro-ink-soft); }

.loading, .empty {
  padding: 18px;
  text-align: center;
  color: var(--ro-ink-soft);
  font-size: 12px;
}
.error-box {
  background: #f3d6d6;
  border: 2px solid var(--ro-red);
  padding: 12px;
  color: #5f1a1a;
  font-size: 12px;
}
.error-box code {
  display: block;
  background: #2b2020;
  color: #ffd7d7;
  padding: 6px 8px;
  margin-top: 6px;
  font-size: 11px;
  overflow-x: auto;
}

.footer {
  max-width: 1240px;
  margin: 0 auto;
  padding: 4px 14px 22px;
  color: #7b8698;
  font-size: 10.5px;
}

/* ---------- Responsive ---------- */
@media (max-width: 768px) {
  .app-shell { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
  .sidebar { position: static; }
  .nav-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 3px; }
  .stat-grid { grid-template-columns: repeat(3, 1fr); }
  .slot-grid { grid-template-columns: 1fr; }
  .rot-grid { grid-template-columns: 1fr; }
  .masthead h1 { font-size: 14px; }
}

</style>
</head>
<body>

  <header class="masthead">
    <h1>&#9670; GEFFEN CODEX &#9670;</h1>
    <p>Baldur's Gate 3 party build wiki, written for a Ragnarok Online brain. Runs entirely offline.</p>
  </header>

  <div class="app-shell">

    <aside class="sidebar">
      <section class="ro-window">
        <div class="ro-titlebar"><span>Menu</span><span class="ro-close"></span></div>
        <div class="ro-body">
          <ul class="nav-list" id="navList"></ul>
        </div>
      </section>

      <section class="ro-window">
        <div class="ro-titlebar"><span>Search</span><span class="ro-close"></span></div>
        <div class="ro-body">
          <input type="search" id="searchBox" class="search-box" placeholder="Search all data..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </section>
    </aside>

    <main>
      <h2 class="ro-h" id="viewTitle">Loading</h2>
      <div id="view">
        <div class="loading">Reading data files...</div>
      </div>
    </main>

  </div>

  <footer class="footer">
    Content lives in <strong>data/*.json</strong> &mdash; edit the JSON, reload the page. No build step, no framework, no CDN.
  </footer>

  <script>window.__BG3_DATA__ = {"characters":{"meta":{"title":"Geffen Codex — BG3 Party Build Wiki","subtitle":"A Ragnarok Online player's guide to a locked-in Baldur's Gate 3 party","levelCap":12,"assumptions":["Party level 2, early Act 1 (Emerald Grove era). Adjust the checklist start point if you are further along.","Difficulty assumed Balanced or Tactician. Nothing here is Honour-mode-illegal, but Honour mode gives bosses Legendary Actions — the Paladin's chokepoint plan matters more there, not less.","Level cap is 12. Every build below is a complete 12-level plan with nothing left over.","Main character race assumed Wood Elf (+2 DEX / +1 WIS). If yours differs, the stat table's 'base' column still holds — only the racial row changes."],"irreversibleMeaning":"In BG3 almost every CLASS choice can be undone by paying Withers 100 gold to respec. 'Irreversible' on a level row means 'locked until you pay for a respec' — think RO skill reset via Neuralizer, not a permanent mistake. The genuinely permanent things (one-time items, story locks, recruits) are flagged in the Checklist instead.","gearDisclaimer":"Gear locations are written from knowledge of a patched game and Larian moves vendors and loot between patches. Treat every location as 'verify in-game' rather than gospel. The ITEM EFFECTS are what the build depends on — if an item moved, the effect is still what you are shopping for.","provenance":{"summary":"This wiki was written entirely from the author's recall of Baldur's Gate 3. NO SOURCE WAS CONSULTED while writing it — not bg3.wiki, not the game files, not a guide. There is no citation list. Treat it as an experienced player's notes written from memory, not as a reference work. The confidence tiers below tell you which parts are worth double-checking and in what order.","patchRisk":"Written against knowledge current to roughly May 2026. BG3 has patched repeatedly since launch, and Patch 8 in particular added around a dozen new subclasses — believed to include Swarmkeeper (Ranger), Arcane Archer (Fighter), Swashbuckler (Rogue), Oath of the Crown (Paladin) and Death Domain (Cleric). If you are on that patch, every 'alternatives I am rejecting' list in this wiki is INCOMPLETE. Swashbuckler in particular is a serious competitor for Astarion's Rogue slot and does not appear in his level 3 alternatives at all.","high":["Class feature levels: Extra Attack at Ranger 5, Volley at Hunter 11, Conjure Barrage at Ranger 9, Assassin at Rogue 3, Cunning Action at Rogue 2, Uncanny Dodge at 5, Evasion at 7, Action Surge at Fighter 2, Aura of Protection at Paladin 6.","Feats arrive at class levels 4, 8 and 12 — which is why the Rogue 9 / Fighter 3 split yields only two feats.","Sharpshooter is -5 to hit for +10 damage and is a toggle. Sneak Attack fires once per turn, not per hit. One Concentration spell at a time. Level cap is 12.","The BG3-specific deviations from tabletop: Cleric subclass locks at LEVEL 1, and Paladin Oath is chosen at LEVEL 1. Both differ from 5e, where they are picked at level 3.","Point-buy budget of 27 with 14 costing 7 and 15 costing 9, and the racial bonus spreads used in the stat tables.","Major world locations: Withers in the Dank Crypt under the Overgrown Ruins, Lae'zel caged and guarded by two tieflings north of the beach, Gale at Roadside Cliffs, the Adamantine Forge in Grymforge, the House of Hope reached via Helsik's ritual."],"medium":["Exact number of spells known at each Ranger level.","The precise domain spell pairings granted at each Life Domain and Oath of the Ancients tier.","How Divine Intervention's choice actually presents itself at Cleric 10.","Whether Heroes' Feast consumes a material component in the current build."],"low":["FAVOURED ENEMY AND NATURAL EXPLORER option names and effects. This was the weakest recall in the whole document — the text hedges toward 'low stakes, pick anything' partly because the exact menu could not be recalled cleanly. Verify this at character level 1.","EVERY VENDOR NAME AND ITEM LOCATION in the Gear section. Gloves of Archery on Arron, the seller of Whispering Promise, the Amulet of Misty Step, Callous Glow Ring, Boots of Stormy Clamour, The Dead Shot and Killer's Sweetheart are all best-effort.","Gontr Mael's location specifically — flagged in the gear notes as moving between patches.","All gold prices are rough estimates."],"verifyOrder":["1. The four irreversible subclass locks: Life Domain at Cleric 1, Ancients at Paladin 1, Assassin at Rogue 3, Champion at Fighter 3. Each costs 100g to undo.","2. The Hag's Hair to DEX chain, because the level 8 Ability Improvement depends on DEX landing on 18 rather than 17.","3. The Favoured Enemy and Natural Explorer menus at level 1 — the weakest section here.","4. Gear locations lazily, act by act, as you reach them. Do not pre-verify all 37 items.","GOLDEN RULE: whatever the level-up screen or the vendor's inventory actually shows you overrides this wiki. If the game disagrees, the game is right."]},"partySlots":{"summary":"FIVE builds, FOUR seats. BG3 caps the active party at four. Gale was added as an AoE nuker on the reasoning that the Ranger and the Assassin overlap — and that is broadly right, though not for the reason it first appears.","theRealReason":"The Ranger and the Assassin are actually different jobs (sustained ranged AoE vs single-target melee burst). What they genuinely share is that both are DEX-based PHYSICAL attackers who need advantage and good positioning, so they struggle against the same enemies at the same time. The bigger issue is what the original four lacked entirely: an arcane caster, real crowd control, and any meaningful magical damage. Gale supplies all three.","recommendedFour":"Main (ranged physical AoE) + Gale (magical AoE and control) + Shadowheart (heal and buff) + Paladin (tank). That is a textbook balanced party and is better rounded than the original.","whatYouLose":["ASTARION'S SLEIGHT OF HAND AND STEALTH EXPERTISE. This is the real cost. He is the only lockpicker and trap-disarmer in the roster, and Act 1 is full of both. Nobody else comes close.","The round-one alpha strike. Gale does single-target damage (Scorching Ray, later Disintegrate) but never as spikily as an Assassin opener.","Astarion's personal questline progresses more slowly if he is benched, though it does not break."],"mitigations":["TEACH GALE 'KNOCK' (2nd-level spell, available at Wizard 3). It opens locked containers and doors and covers most of what you lose.","SWAPPING IS FREE AND REVERSIBLE. You change the active party at camp any time, at no cost. Benched companions still gain XP and stay at your level, so nobody falls behind.","The practical pattern most players land on: run Gale for combat, swap Astarion in when you hit a locked or heavily trapped area, swap back. It costs one trip to camp.","Lockpicking without proficiency still works, just at worse odds. A high-DEX character with thieves' tools will open easy locks."],"verdict":"Add Gale, bench Astarion by default, keep him levelled and swap him in for lock-heavy areas. Do NOT delete or dismiss anyone — there is no reason to, and the roster costs nothing to maintain."},"progressionPrimer":["NO STAT POINTS ON LEVEL UP. This is the biggest break from RO. Your six ability scores are set at character creation and never rise from levelling. They change only at class levels 4, 8 and 12 (where a feat can be traded for +2), and from two one-time items — Auntie Ethel's Hag's Hair (+1, Act 1) and the Mirror of Loss (+2, Act 3). There is no 'I will fix my DEX later'.","NO SKILL POINTS AND NO SKILL TREE. You do not spend anything. The game hands you specific features at specific levels. Most level-ups present NO choice at all — you read what you gained and click Next.","ONLY ABOUT HALF YOUR LEVELS ARE ACTUAL DECISIONS. The rest are automatic. Knowing which is which is most of what 'planning a build' means in BG3.","RESPEC IS 100 GOLD AND UNLIMITED. Withers at camp rebuilds any character from scratch, as many times as you like. In RO a skill reset is a big deal; here it is pocket change. No CLASS choice in this wiki is ever truly permanent — subclass locks just mean 'costs 100g to change'.","WHAT IS ACTUALLY PERMANENT: one-time items (Hag's Hair, Mirror of Loss, your limited Adamantine forgings), story forks, and companion recruitment. Guard those. Relax about everything else.","THE CAP IS 12, reached around the middle of Act 3. There is no grind to 99, no rebirth. You stop levelling with a good chunk of game left, and GEAR is the entire back half of your power curve — which is why the gear list matters more than it would in RO.","SPELLS: Clerics and Paladins PREPARE spells and can re-pick the whole list for free any time outside combat, so those choices are never commitments. Rangers KNOW spells and can only swap them on level-up — so Ranger spell picks are semi-permanent, and they are the only spell choices in this party worth pausing over.","MULTICLASSING IS THE JOB-CHANGE MOMENT, and it is a misclick risk. On the levels where Astarion or the Paladin dips into Fighter, the level-up screen defaults to continuing their current class. You must actively pick the other class — and then actively pick the ORIGINAL class again when the dip is done."],"analogyTopLevel":["The single biggest break from RO: BG3 has no cast time, no ASPD, no delay. Everything is 1 Action + 1 Bonus Action + 1 Movement per turn. Your DPS ceiling is 'how many attack rolls can I buy per turn', not 'how fast can I spam'.","There is no SP pool. Spell slots are per-rest charges, closer to RO consumables than to SP. Running dry means resting, not sitting.","There is no EXP penalty for party size and no leech — everyone in the party of 4 gets full XP. Bench swapping costs nothing.","Levels stop at 12. There is no 99/70 grind, no rebirth. Gear, not levels, is your progression curve for most of the game."]},"characters":[{"id":"main","name":"Sniper","roClass":"Sniper","bg3Build":"Hunter Ranger 12","role":"AoE DPS / Ranged Carry","badge":"sniper","summary":"A pure single-class Ranger. Falcon-less, but Beast Tamer gives you a familiar that plays the Falcon's support role. Your whole game is: stand far away on high ground, toggle Sharpshooter, and convert one Action into as many attack rolls as the party can buy you.","stats":{"str":8,"dex":17,"con":14,"int":8,"wis":15,"cha":12},"statNotes":{"str":"Dumped. Only cost is carry weight and Athletics (shoving). Let the Paladin shove things.","dex":"Primary. Attack rolls, damage, AC, initiative, and Stealth all key off this. Target 20 by level 8.","con":"14 is the floor. Concentration saves for Hunter's Mark and Ensnaring Strike live here, plus HP.","int":"Dumped. Only Arcana checks. Nothing in the build touches it.","wis":"15 sets your spell save DC for Ensnaring Strike and Conjure Barrage, and drives Perception (trap and ambush detection).","cha":"12 is deliberate — the main character does almost all the dialogue in BG3. +1 Persuasion is worth more here than a 16th point of CON."},"statPlan":["Point-buy base (27 points): STR 8, DEX 15, CON 14, INT 8, WIS 14, CHA 12.","Wood Elf racial: +2 DEX, +1 WIS. Result: STR 8, DEX 17, CON 14, INT 8, WIS 15, CHA 12.","Auntie Ethel's Hag's Hair (Act 1, one per playthrough) into DEX: 17 to 18.","Level 8 Ability Improvement +2 DEX: 18 to 20. This is why the hair MUST go to DEX and not to anyone else."],"roMapping":[{"roSkill":"Double Strafe","bg3":"Your basic 2 attacks after Extra Attack (level 5)","breaks":"No SP cost, no cast delay — but you only get ONE Action, so it is 2 shots per turn and that is the cap until Volley."},{"roSkill":"Arrow Shower","bg3":"Conjure Barrage (Ranger 9)","breaks":"Fires from YOU in a cone, not placed on a target cell. It is a spell slot, not spammable, and enemies get a DEX save for half."},{"roSkill":"Sharp Shooting","bg3":"Volley (Hunter 11)","breaks":"Volley is the real AoE workhorse — it hits every enemy in a radius with a SEPARATE attack roll each, so Sharpshooter and all your damage riders apply to every hit. Nothing in RO is this good."},{"roSkill":"Blitz Beat","bg3":"Horde Breaker (Hunter's Prey, level 3)","breaks":"No falcon, no proc chance, no AGI scaling. It is a guaranteed free extra attack once per turn against a DIFFERENT enemy standing next to your target."},{"roSkill":"Falcon","bg3":"Beast Tamer familiar (Natural Explorer, level 1)","breaks":"It does not auto-attack for you. Its job is the Help action to grant advantage, and body-blocking. It is a utility pet, not a damage pet."},{"roSkill":"Trap line / Land Mine","bg3":"Spike Growth + Ensnaring Strike","breaks":"No trap items to farm, no placement charges. Spike Growth is a persistent damaging zone — the closest thing to a trap field you get."}],"levels":[{"level":1,"menu":"Ranger — Favoured Enemy, then Natural Explorer","choice":"Favoured Enemy: Bounty Hunter | Natural Explorer: Beast Tamer","alternatives":["Favoured Enemy: Ranger Knight","Favoured Enemy: Keeper of the Veil","Favoured Enemy: Mage Breaker","Favoured Enemy: Sanctified Stalker","Natural Explorer: Urban Tracker","Natural Explorer: Wasteland Wanderer (Fire / Cold / Poison)"],"reasoning":"Beast Tamer grants Find Familiar — a free pet that can Help an adjacent ally every single round, which is a permanent advantage engine for Astarion and for you.","details":["Favoured Enemy is genuinely low-stakes for an archer — none of the five options change your damage rotation. Bounty Hunter is picked here for the skill proficiency only.","Ranger Knight is the only one that changes your gear options (heavy armour proficiency). SKIP IT: at STR 8 heavy armour just slows your movement, and you want DEX-scaling medium armour anyway.","Wasteland Wanderer: Fire is the honourable-mention Natural Explorer — Act 1 is full of burning ground and the Underdark is full of fire. Take it at level 10 instead."],"irreversible":true},{"level":2,"menu":"Fighting Style, then Spells Known (pick 2)","choice":"Fighting Style: Archery | Spells: Hunter's Mark, Ensnaring Strike","alternatives":["Fighting Style: Defence","Fighting Style: Dueling","Fighting Style: Two-Weapon Fighting","Spells: Longstrider","Spells: Cure Wounds","Spells: Hail of Thorns","Spells: Speak with Animals"],"reasoning":"Archery is +2 to every ranged attack roll for the whole game and directly offsets Sharpshooter's -5; it is not optional for this build.","details":["Rangers KNOW spells, they do not prepare them. You cannot swap them daily — only on level-up. This is unlike Shadowheart, who re-picks every long rest.","Hunter's Mark: +1d6 per hit, costs a Bonus Action and Concentration. With Extra Attack + Horde Breaker that is +3d6 a turn. Move it to a new target for free when your mark dies.","Ensnaring Strike: your ranged Ankle Snare. Restrains a target (they cannot move, attacks against them get advantage). Concentration — so it competes with Hunter's Mark. Use it on the one dangerous melee enemy, not on trash.","Speak with Animals is a real loss to skip. Pick it up on a level-up swap later if you care about the dialogue content — it opens a surprising number of quests in Act 1."],"irreversible":false},{"level":3,"menu":"Ranger Subclass, then Hunter's Prey, then 1 new spell","choice":"Subclass: Hunter | Hunter's Prey: Horde Breaker | Spell: Longstrider","alternatives":["Subclass: Beast Master","Subclass: Gloom Stalker","Hunter's Prey: Colossus Slayer","Hunter's Prey: Giant Killer"],"reasoning":"Horde Breaker is your Blitz Beat — one free extra attack per turn against a second enemy adjacent to your target, which turns every clumped pack into free damage.","details":["Colossus Slayer (+1d8 vs damaged targets, once per turn) is the higher single-target pick and is the honest competitor. You are building AoE, so Horde Breaker wins — but know that on boss-only fights Colossus Slayer would out-damage it.","Giant Killer is a trap. It only works against Large+ creatures and it is a reaction.","Gloom Stalker is the strongest Ranger subclass in the game (extra attack on round 1, +WIS initiative, invisible in darkness). You have committed to Hunter for the RO AoE fantasy and Volley — that is a legitimate choice, just be aware Gloom Stalker is the meta pick.","Longstrider is +3m movement, lasts until Long Rest, and can be cast on the whole party out of combat. Free repositioning forever."],"irreversible":true},{"level":4,"menu":"Feat","choice":"Sharpshooter","alternatives":["Ability Improvement (+2 DEX)","Alert","Savage Attacker","Lucky","Dual Wielder"],"reasoning":"-5 to hit for +10 damage per arrow, and it removes the high-ground disadvantage penalty entirely — with 2-3 attacks a turn that is +20 to +30 damage per round.","details":["Sharpshooter is a TOGGLE in BG3, not always-on. Turn it OFF against high-AC targets (heavily armoured knights, some bosses) and ON against everything else. Learn to check enemy AC by hovering them.","The Archery fighting style (+2) plus Bless from Shadowheart (+1d4) plus advantage from the familiar's Help largely cancels the -5. This is why the party is built the way it is.","Do NOT take the +2 DEX here. Sharpshooter's +10 flat damage dwarfs a +1 modifier, and you get DEX at level 8 anyway."],"irreversible":false},{"level":5,"menu":"No choice for the class feature; 1 new spell (2nd-level unlocked)","choice":"Extra Attack (automatic) | Spell: Spike Growth","alternatives":["Spell: Pass Without Trace","Spell: Silence","Spell: Lesser Restoration","Spell: Darkvision"],"reasoning":"Extra Attack doubles your Action into 2 shots, which also doubles every per-hit rider you own — this is the single biggest power spike in the build.","details":["Extra Attack + Horde Breaker = 3 attack rolls per turn from level 5 onward. With Hunter's Mark that is 3d6 bonus damage; with Sharpshooter that is +30.","Spike Growth is your Land Mine field. It is difficult terrain that deals damage per metre moved — combine it with the Paladin shoving enemies into it, or with Ensnaring Strike to pin something inside it.","Pass Without Trace (+10 party Stealth) is the strong alternative and it is what enables Astarion's Assassinate opener from full party stealth. If you find yourself fumbling stealth openers, swap Longstrider for it."],"irreversible":false},{"level":6,"menu":"Favoured Enemy (second pick)","choice":"Mage Breaker","alternatives":["Ranger Knight","Keeper of the Veil","Sanctified Stalker","Bounty Hunter (if not already taken)"],"reasoning":"Low-stakes menu again; Mage Breaker's Arcana proficiency is the most generally useful of what is left.","details":["Nothing on this menu changes your rotation. Do not agonise. If you already regret the level 1 pick, this is your chance to grab the other one you wanted."],"irreversible":true},{"level":7,"menu":"Hunter — Defensive Tactics, then 1 new spell","choice":"Defensive Tactics: Escape the Horde | Spell: Silence","alternatives":["Defensive Tactics: Multiattack Defence","Defensive Tactics: Steel Will","Spell: Pass Without Trace","Spell: Lesser Restoration"],"reasoning":"Escape the Horde gives enemies disadvantage on opportunity attacks against you — an archer's job is leaving melee alive, and this is the only option that helps you do it.","details":["Multiattack Defence only helps if you are already being hit repeatedly, which means the plan has already failed. Steel Will (advantage vs Frightened) is too situational.","Silence is an underrated pick: it is an AoE zone where no spells can be cast. Drop it on an enemy caster group and they are disabled without a save. Concentration, so you give up Hunter's Mark that fight."],"irreversible":true},{"level":8,"menu":"Feat","choice":"Ability Improvement: +2 DEX (18 to 20)","alternatives":["Alert","Savage Attacker","Lucky","Resilient (Constitution)"],"reasoning":"Takes you to the DEX cap of 20: +1 to every attack roll, +1 damage per arrow, +1 AC, +1 initiative, +1 Stealth — this is why Hag's Hair went into DEX.","details":["CRITICAL DEPENDENCY: this only reaches 20 if you gave Auntie Ethel's Hag's Hair to yourself and put it in DEX. If you gave the hair away or spent it elsewhere, you land on 19 — which is the SAME modifier as 18 and therefore a wasted feat. In that case take Alert here instead and pick up DEX at 12.","Ability scores hard-cap at 20 in BG3 except via specific items. Do not plan past 20."],"irreversible":false},{"level":9,"menu":"1 new spell (3rd-level unlocked)","choice":"Conjure Barrage","alternatives":["Lightning Arrow","Protection from Energy","Plant Growth","Daylight"],"reasoning":"This is your Arrow Shower — a large cone of arrows from your position, one spell slot, DEX save for half.","details":["ANALOGY BREAK: Conjure Barrage does NOT scale with your Sharpshooter, your Hunter's Mark, or your bow's damage riders. It is a flat spell (roughly 3d8 in a cone). It is a slot-limited nuke for packed groups, not your main AoE.","Volley at level 11 is the AoE you actually want, because Volley makes real attack rolls that DO carry all your bonuses. Conjure Barrage is the stopgap for levels 9 and 10.","Lightning Arrow is the single-target-plus-splash competitor and is arguably better damage. Take Conjure Barrage for the fantasy and the wider cone; swap on a later level-up if the numbers disappoint you."],"irreversible":false},{"level":10,"menu":"Natural Explorer (second pick)","choice":"Wasteland Wanderer: Fire","alternatives":["Urban Tracker","Wasteland Wanderer: Cold","Wasteland Wanderer: Poison","Beast Tamer (if not already taken)"],"reasoning":"Fire resistance is the most commonly relevant damage type across Acts 2 and 3, and halves a lot of surface damage you will inevitably stand in.","details":["Poison resistance is the Act 1 pick (spiders, Ethel, kuo-toa) — by level 10 you are past most of that.","If you skipped Beast Tamer at level 1 and now want the familiar, this is your one chance to grab it."],"irreversible":true},{"level":11,"menu":"Hunter — Multiattack, then 1 new spell","choice":"Multiattack: Volley | Spell: Protection from Energy","alternatives":["Multiattack: Whirlwind Attack","Spell: Lightning Arrow","Spell: Daylight"],"reasoning":"Volley is the payoff for the entire build — one Action, one separate attack roll against EVERY enemy in a radius, each carrying Sharpshooter, your bow bonuses, and your DEX.","details":["Whirlwind Attack is the melee version. It is strictly wrong for a longbow build — do not misclick this.","Volley against 4 enemies with Sharpshooter is roughly 4 x (1d8 + 5 + 10). This is the moment the build goes from good to absurd.","Volley does NOT trigger Hunter's Mark on every target (Hunter's Mark is single-target), and it does not proc Horde Breaker. It replaces your normal attack Action, so it is Volley OR 2-shots-plus-Horde-Breaker — use Volley at 3+ targets, normal attacks at 1-2."],"irreversible":true},{"level":12,"menu":"Feat","choice":"Alert","alternatives":["Savage Attacker","Lucky","Resilient (Constitution)","Ability Improvement (+2 WIS)"],"reasoning":"+5 initiative means you Volley before the enemy pack has moved or spread out, which is worth more than any damage feat once your damage is already this high.","details":["Alert also makes you immune to being Surprised — which prevents the worst-case ambush opener where your whole party loses a round.","Lucky (3 rerolls per long rest) is the strongest defensive alternative and is excellent on Honour mode where a single failed save can end a run.","Savage Attacker rerolls weapon damage dice — but your damage is mostly FLAT (+10 Sharpshooter, +5 DEX), so it only rerolls the 1d8. It is the weakest option here despite sounding good.","Resilient (Constitution) is the pick if you keep losing Hunter's Mark concentration."],"irreversible":false}]},{"id":"astarion","name":"Assassin Cross","roClass":"Assassin Cross","bg3Build":"Assassin Rogue 9 / Champion Fighter 3","role":"Single-target Burst / Opener","badge":"assassin","summary":"The Sonic Blow / Meteor Assault turn. Astarion's entire value is round one: win initiative, attack from stealth against enemies that have not acted, and delete the single most dangerous target before it ever takes a turn.","stats":{"str":8,"dex":17,"con":15,"int":9,"wis":14,"cha":10},"statNotes":{"str":"Dumped. He fights with Finesse weapons (daggers), which use DEX for attack and damage.","dex":"Primary. Attack, damage, AC, initiative, Stealth, Sleight of Hand — every single thing he does.","con":"15 for HP and Concentration. He gets focused hard when he opens a fight in the enemy's face.","int":"Dumped (High Elf forces +1 here, which is unavoidable waste).","wis":"14 is deliberately high for a Rogue — WIS saves are the most common save-or-lose in the game (Hold Person, Fear, Command) and he has no proficiency in them.","cha":"10. He is your backup talker for Deception and Persuasion checks the main character fails."},"statPlan":["Point-buy base (27 points): STR 8, DEX 15, CON 15, INT 8, WIS 14, CHA 10.","High Elf racial: +2 DEX, +1 INT. Result: STR 8, DEX 17, CON 15, INT 9, WIS 14, CHA 10.","Rogue 8 Ability Improvement +2 DEX: 17 to 19. (17 and 18 are both +3/+4 — this jump is worth exactly +1 modifier.)","If you Ascend him in Act 3 he gains +2 to ALL abilities, which pushes DEX to 21 and breaks the normal cap. See the Checklist for the cost of that choice."],"roMapping":[{"roSkill":"Cloaking / Hiding","bg3":"Cunning Action: Hide (Bonus Action, from level 2)","breaks":"Hiding requires you to actually break line of sight or pass a Stealth check against enemy Perception — it is not a toggle. Enemies remember roughly where you went."},{"roSkill":"Sonic Blow","bg3":"Sneak Attack + Action Surge multi-hit turn","breaks":"Sneak Attack fires ONCE PER TURN, not per hit. Extra attacks exist to give you more chances to land that one big die pool, not to stack it."},{"roSkill":"Enchant Poison / Weapon Buff","bg3":"Coatings (Basic/Malefic/Drow Poison, Oil of Sharpness)","breaks":"Coatings are consumable items applied as a Bonus Action, last a few turns, and do not stack with each other. Buy them constantly — they are cheap and Astarion is the one who should always be wearing one."},{"roSkill":"Critical / Katar build","bg3":"Champion Improved Critical (crit on 19-20) + Assassinate auto-crit vs Surprised","breaks":"There is no CRIT stat. Crit chance is fixed at 5% per attack (10% with Champion) unless a specific item or condition guarantees it."},{"roSkill":"Grimtooth / Back Slide","bg3":"Cunning Action: Dash / Disengage","breaks":"No hidden-state movement skills. Disengage is the tool that lets him leave melee without eating an opportunity attack."}],"levels":[{"level":1,"menu":"Rogue — Expertise (pick 2 skills)","choice":"Expertise: Stealth + Sleight of Hand","alternatives":["Expertise: Perception","Expertise: Persuasion","Expertise: Acrobatics","Expertise: Deception"],"reasoning":"Stealth is the precondition for his entire opener, and Sleight of Hand is the party's lockpicking and disarming skill — nobody else has it.","details":["Astarion arrives pre-built as a Rogue. You only need Withers if you want to fix his ability spread — his default array is playable but not optimal.","Sneak Attack (1d6 now, 5d6 at Rogue 9) requires either advantage on the attack, or an ally within 1.5m of the target. Remember the second condition — it means he does NOT need to hide every single turn if the Paladin is already in melee.","Expertise doubles your proficiency bonus on that skill. Perception expertise on someone is genuinely valuable for trap detection — but give that to the main character, who has WIS 15."],"irreversible":false},{"level":2,"menu":"No choices","choice":"Cunning Action (automatic)","alternatives":[],"reasoning":"Dash, Disengage, and Hide all become Bonus Actions — this is what makes a Rogue mobile enough to reposition into backstab range every round.","details":["Hide as a Bonus Action is the loop: attack with your Action, Hide with your Bonus Action, and next turn you are attacking with advantage again (which re-enables Sneak Attack).","This loop competes with his off-hand attack, which is also a Bonus Action. Hide when you need advantage; off-hand attack when you already have it."],"irreversible":false},{"level":3,"menu":"Roguish Archetype","choice":"Assassin","alternatives":["Thief","Arcane Trickster"],"reasoning":"Assassinate grants advantage against any creature that has not yet taken a turn, and automatic critical hits against Surprised creatures — it is the burst opener you asked for.","details":["IRREVERSIBLE without a 100g respec. This is the pick your Alert feat exists to support.","HONEST COMPARISON: Thief gives a SECOND Bonus Action every turn, forever. That means off-hand attack AND hide, every round, in every fight. Across a whole playthrough Thief usually out-damages Assassin because Assassin's power is concentrated in round one only.","Assassin is the right pick IF you play to it — full party stealth approach, Alert for initiative, and killing something important before it acts. If you find yourself walking into fights and rolling initiative normally, respec to Thief and do not feel bad.","Arcane Trickster is a caster hybrid and is off-plan entirely."],"irreversible":true},{"level":4,"menu":"Feat","choice":"Alert","alternatives":["Ability Improvement (+2 DEX)","Savage Attacker","Dual Wielder","Mobile"],"reasoning":"Assassinate only works against creatures that have not acted yet, so winning initiative is not a nice-to-have — it is the feature's activation condition.","details":["+5 initiative on a character who already has DEX 17 (+3) means he will win the roll against nearly everything in the game.","Alert also grants immunity to Surprise, so he never loses his own opening round to an ambush.","Do not delay this. Taking Alert at level 8 instead means four levels of a subclass that half-works."],"irreversible":false},{"level":5,"menu":"Fighter — Fighting Style (this is the multiclass dip; choose Fighter at the level-up screen)","choice":"Fighter 1 | Fighting Style: Two-Weapon Fighting","alternatives":["Fighting Style: Archery","Fighting Style: Defence","Fighting Style: Dueling","Stay pure Rogue"],"reasoning":"Two-Weapon Fighting adds your DEX modifier to off-hand damage, which is otherwise flat — with two daggers that is roughly +4 damage per round for free.","details":["MULTICLASS WARNING: at the level-up screen you must click the multiclass option and select Fighter, not continue as Rogue. It is easy to autopilot past this.","Fighter 1 also grants Second Wind (Bonus Action self-heal) and heavy armour proficiency you will never use.","If you decide to run him with hand crossbows instead of daggers, take Archery here instead. Daggers are recommended because the Act 3 endgame items (Bhaalist Armour, Crimson Mischief, Bloodthirst) are all melee piercing and are the strongest package in the game."],"irreversible":false},{"level":6,"menu":"No choices","choice":"Fighter 2 | Action Surge (automatic)","alternatives":[],"reasoning":"One extra full Action per short rest — this is the entire reason for the Fighter dip and it doubles his opening burst.","details":["Action Surge recharges on a SHORT rest, and you get two short rests per long rest. Use it every fight that matters; there is no reason to hoard it.","Round one with Assassinate: Attack (Sneak Attack applies) + Action Surge Attack + Bonus Action off-hand attack. Against a Surprised target, all of those are automatic critical hits."],"irreversible":false},{"level":7,"menu":"Martial Archetype","choice":"Fighter 3 | Champion","alternatives":["Battle Master","Eldritch Knight"],"reasoning":"Improved Critical widens his crit range to 19-20, doubling his crit rate — and Sneak Attack dice are doubled on a crit, so his crits are enormous.","details":["IRREVERSIBLE without respec.","Battle Master is the alternative and gives 3 maneuvers plus superiority dice. It is more versatile. Champion is picked here because it is passive, always-on, and multiplies the one huge hit that defines this character. Your Paladin is already covering the Battle Master role.","Champion pairs with any 'guaranteed crit' item (Killer's Sweetheart in Act 3) to make one turn per fight a certainty rather than a gamble."],"irreversible":true},{"level":8,"menu":"No choices (back to Rogue — remember to select Rogue, not Fighter)","choice":"Rogue 5 | Uncanny Dodge (automatic)","alternatives":[],"reasoning":"Halve the damage of one attack per round as a Reaction — the survivability patch for a character who opens fights standing in the enemy's face.","details":["Sneak Attack rises to 3d6 here.","From this level onward every level is Rogue. Do not accidentally take Fighter 4."],"irreversible":false},{"level":9,"menu":"Rogue — Expertise (pick 2 more skills)","choice":"Rogue 6 | Expertise: Perception + Persuasion","alternatives":["Expertise: Acrobatics","Expertise: Deception","Expertise: Investigation"],"reasoning":"Perception expertise makes him the party's trap-spotter on the character who walks in front, and Persuasion gives you a second dialogue option when the main character's roll is bad.","details":["Deception is the alternative if you are role-playing him as the liar — mechanically Persuasion appears in more checks."],"irreversible":false},{"level":10,"menu":"No choices","choice":"Rogue 7 | Evasion (automatic)","alternatives":[],"reasoning":"Successful DEX saves take zero damage instead of half — this makes him nearly immune to fireballs and breath weapons, which are the main things that kill squishy melee.","details":["Sneak Attack rises to 4d6."],"irreversible":false},{"level":11,"menu":"Feat","choice":"Rogue 8 | Ability Improvement: +2 DEX (17 to 19)","alternatives":["Savage Attacker","Lucky","Mobile","Resilient (Wisdom)"],"reasoning":"17 to 19 is +1 to attack, +1 damage on both weapons, +1 AC and +1 initiative — the broadest single upgrade available at this point.","details":["Savage Attacker is unusually good on THIS character specifically, because he rolls a huge pile of Sneak Attack dice and Savage Attacker rerolls them. If you have already found a way to raise his DEX with items, take Savage Attacker instead.","Note that 19 is not 20 — the Hag's Hair went to your main character. This is the intended trade."],"irreversible":false},{"level":12,"menu":"No choices","choice":"Rogue 9 | Infiltration Expertise (automatic)","alternatives":["Take Fighter 4 instead for a third feat"],"reasoning":"Sneak Attack rises to 5d6, which is the real payoff; the Assassin feature itself at this level is a disguise utility and is close to worthless in combat.","details":["FLAGGING A BETTER OPTION THAN YOUR LOCKED PLAN: Rogue 8 / Fighter 4 instead of Rogue 9 / Fighter 3 trades 1d6 of Sneak Attack for an entire extra FEAT (Savage Attacker or an ASI). That is a straightforwardly better level 12 for combat.","You specified Rogue 9 / Fighter 3, so that is what this table builds. I am flagging the alternative because it costs you nothing to know it and the swap is a single 100g respec.","If you take Fighter 4, the level order is identical except the last level is Fighter instead of Rogue."],"irreversible":false}]},{"id":"gale","name":"High Wizard","roClass":"High Wizard","bg3Build":"Evocation Wizard 12","role":"AoE Nuker / Control","badge":"wizard","summary":"The class this party was missing. Everything else you own deals physical damage and swings at one target; Gale deletes whole groups and disables the fights you cannot win straight. Evocation is picked specifically so your Fireballs stop killing your own tank.","stats":{"str":9,"dex":15,"con":15,"int":16,"wis":11,"cha":11},"statNotes":{"str":"Dumped. Human's +1 to everything drags it to 9 whether you like it or not.","dex":"15 for AC (with Mage Armour) and initiative. A wizard who acts late is a wizard who dies before casting.","con":"15. The most important defensive stat he has — HP, and Concentration saves for Web, Haste and Hypnotic Pattern.","int":"PRIMARY. Spell save DC, spell attack rolls, and from level 10 it is added to every Evocation spell's damage. Target 20 by level 8.","wis":"11. His weakest save and the most commonly targeted one. The Paladin's Aura of Protection patches this.","cha":"11. Backup dialogue only."},"statPlan":["Point-buy base (27 points): STR 8, DEX 14, CON 14, INT 15, WIS 10, CHA 10.","Human racial: +1 to ALL six abilities. Result: STR 9, DEX 15, CON 15, INT 16, WIS 11, CHA 11.","Level 4 Ability Improvement +2 INT: 16 to 18. Level 8 Ability Improvement +2 INT: 18 to 20.","Gale arrives pre-built. A respec is OPTIONAL for him — unlike Shadowheart, nothing about his default is locked wrongly, since his subclass is not chosen until level 2. Respec only if you want the exact array above.","Act 3 Mirror of Loss can push INT past 20 if you have not spent his use elsewhere."],"roMapping":[{"roSkill":"SP bar and SP regen","bg3":"Spell slots — a fixed number of charges per Long Rest","breaks":"THE BIGGEST BREAK IN THE WHOLE WIKI. There is no SP pool, no SP regeneration, no Blue Potion economy. You get a small fixed number of casts per rest and that is all. A level 5 Gale has roughly two Fireballs in him per long rest, not twenty. Arcane Recovery returns a few slots once per short rest and that is your only refill."},{"roSkill":"Auto-attack while out of SP","bg3":"Cantrips (Fire Bolt, Ray of Frost)","breaks":"Cantrips are unlimited and scale with your level, so they are what you cast when the slots run dry. They are weak but free — treat them as your wand-hitting, not as a rotation staple."},{"roSkill":"Meteor Storm","bg3":"Fireball (Wizard 5)","breaks":"One burst, one slot, DEX save for half. It does not tick repeatedly over an area like Meteor Storm — it goes off once and it is done."},{"roSkill":"Storm Gust","bg3":"Ice Storm (Wizard 7), then Cone of Cold (Wizard 9)","breaks":"No freeze-lock loop. Ice Storm leaves icy ground that can knock enemies Prone, which is the closest you get to Storm Gust's crowd-freezing, but there is no repeated hit-stun."},{"roSkill":"Lord of Vermilion","bg3":"Chain Lightning (Wizard 11)","breaks":"Chains between a limited number of targets rather than blanketing a screen-sized area. Still your biggest multi-target nuke."},{"roSkill":"Quagmire","bg3":"Grease (Wizard 1), then Web (Wizard 3)","breaks":"These are surfaces and zones, not debuffs on enemies. Grease is flammable — ignite it with Fire Bolt for a genuinely nasty combo. Web restrains outright rather than slowing."},{"roSkill":"Stone Curse","bg3":"Hold Person (Wizard 3) / Hold Monster (Wizard 9)","breaks":"A held target takes AUTOMATIC CRITICAL HITS from melee. Feeding a Hold into your Paladin is a delete button. It is a save every turn though, not a fixed duration."},{"roSkill":"Teleport","bg3":"Misty Step (Wizard 3)","breaks":"Short-range combat blink only, costs a Bonus Action and a spell slot. No map-wide warp, no save points."},{"roSkill":"Energy Coat / Safety Wall","bg3":"Mage Armour, Shield, Mirror Image, Blur","breaks":"Mage Armour is a pre-cast that lasts until Long Rest — put it up every morning. Shield is a REACTION for +5 AC after you see an attack roll, which has no RO equivalent at all."},{"roSkill":"No friendly fire in RO","bg3":"BG3 AoE HITS YOUR OWN PARTY","breaks":"This is the one that will kill your Paladin. A Fireball centred on a melee scrum damages Lae'zel exactly as much as the goblins. Evocation's Sculpt Spells at level 2 is the fix and it is the entire reason this build picks Evocation."},{"roSkill":"Learning skills from the skill tree","bg3":"Scribing spells from scrolls","breaks":"Wizards are the only class that can permanently learn spells from found scrolls. Buy every Wizard scroll from every vendor and scribe it. His spellbook can end up far larger than his level-up picks alone would allow — there is nothing like this in RO."}],"levels":[{"level":1,"menu":"Wizard — Cantrips (pick 3), then spells for the spellbook","choice":"Cantrips: Fire Bolt, Ray of Frost, Mage Hand | Spellbook: Mage Armour, Shield, Magic Missile, Grease, Sleep, Burning Hands","alternatives":["Cantrips: Acid Splash, Light, Bone Chill, Minor Illusion, Shocking Grasp, Blade Ward","Spells: Chromatic Orb, Thunderwave, Colour Spray, Witch Bolt, Feather Fall, Find Familiar, Longstrider"],"reasoning":"Fire Bolt is your unlimited attack for when the slots run dry; Mage Armour and Shield are the only reasons a wizard with 15 DEX survives being looked at.","details":["Gale arrives pre-built with his own picks. You do NOT need to respec him — his subclass is not chosen until level 2, so nothing is locked wrongly yet.","MAGE ARMOUR IS A DAILY RITUAL. Cast it at camp every morning; it lasts until Long Rest and raises his AC to 13 + DEX. Forgetting it is the single most common way Gale dies.","Wizards PREPARE spells from their spellbook, like Clerics. The prepared list is free to rewrite outside combat, so only the SPELLBOOK contents are a real commitment — and you can always add more via scrolls.","Grease plus Fire Bolt is a real level 1 combo: cast the grease, ignite it, watch a corridor burn.","Arcane Recovery is granted automatically: once per Short Rest, recover some expended spell slots. Use it every short rest without exception."],"irreversible":false},{"level":2,"menu":"Arcane Tradition (Wizard subclass)","choice":"School of Evocation","alternatives":["Divination","Abjuration","Necromancy","Transmutation","Enchantment","Illusion","Conjuration"],"reasoning":"Sculpt Spells makes your allies automatically succeed their saves and take ZERO damage from your own evocation AoE — which is what lets you drop Fireball onto a melee scrum your own tank is standing in.","details":["LOCKS IN (100g at Withers to change). This is Gale's only genuinely irreversible choice.","Read Sculpt Spells carefully because it changes how you play: without it, every Fireball is a decision about how much of your own party you are willing to burn. With it, you just cast.","Divination is the strongest Wizard subclass in the game in raw power terms (Portent lets you replace enemy rolls with pre-rolled dice). It is a legitimate alternative and I am flagging it honestly — but it does nothing for the AoE-nuker role you actually want, and it will not stop you killing Lae'zel.","Abjuration is the tanky pick, Necromancy the summoner. Neither fits the brief."],"irreversible":true},{"level":3,"menu":"2 new spells for the spellbook (2nd level unlocked)","choice":"Scorching Ray + Web","alternatives":["Misty Step","Mirror Image","Knock","Shatter","Invisibility","Hold Person","Blur","Cloud of Daggers"],"reasoning":"Scorching Ray is your best single-target damage for several levels, and Web is the control spell that wins fights you are underlevelled for.","details":["PICK UP KNOCK EARLY IF YOU ARE BENCHING ASTARION. Knock opens locked chests and doors, which is the main practical thing you lose without his Sleight of Hand. Buy the scroll or take it as a level-up pick.","Misty Step and Mirror Image are the two you will want soonest after these. Scrolls are the cheap way to get them without spending level-up picks.","Web requires Concentration. Restrained enemies cannot move and are attacked with advantage — feed a webbed group to your Volley."],"irreversible":false},{"level":4,"menu":"Feat, then a 4th cantrip, then 2 new spells","choice":"Feat: Ability Improvement +2 INT (16 to 18) | Cantrip: Light","alternatives":["Feat: War Caster","Feat: Alert","Feat: Resilient (Constitution)","Feat: Lucky","Cantrip: Acid Splash, Bone Chill, Minor Illusion"],"reasoning":"INT is spell save DC, spell attack rolls, and later flat damage on every evocation — nothing else on this menu comes close for a nuker.","details":["Save DC is what decides whether your Fireball does full or half damage, and whether Hold Person lands at all. Raise it before anything else.","War Caster is the strong alternative if you find yourself losing Concentration on Web and Haste constantly. Take it at 12 instead.","Light matters more than it sounds — Act 2 is the Shadow-Cursed Lands and you will want a light source on demand."],"irreversible":false},{"level":5,"menu":"2 new spells (3rd level unlocked)","choice":"FIREBALL + Counterspell","alternatives":["Haste","Hypnotic Pattern","Slow","Lightning Bolt","Sleet Storm","Stinking Cloud","Fly","Animate Dead"],"reasoning":"Fireball is the single biggest power spike any character in this party gets, and Sculpt Spells means you can drop it anywhere without checking who is standing there.","details":["THIS IS THE LEVEL GALE BECOMES THE STAR. A Fireball into a packed group at level 5 often just ends the encounter.","Counterspell is a REACTION that cancels an enemy spell as it is being cast. There is no RO equivalent and it is one of the most powerful abilities in the game — it turns enemy casters off entirely.","Hypnotic Pattern and Haste are the next two to acquire, ideally via scrolls. Hypnotic Pattern is arguably the best crowd control in the game; Haste on your Paladin or on yourself is an extra action every turn.","SLOT DISCIPLINE: at level 5 you have roughly two 3rd-level slots. That is two Fireballs per long rest. Open with cantrips on trash, save the slots for the fight that matters."],"irreversible":false},{"level":6,"menu":"No choice for the subclass feature; 2 new spells","choice":"Potent Cantrip (automatic) | Spells: Haste + Hypnotic Pattern","alternatives":["Slow","Fly","Protection from Energy","Glyph of Warding"],"reasoning":"Potent Cantrip makes enemies take half damage from your cantrips even when they save, which meaningfully raises your out-of-slots damage floor.","details":["This is the level where running out of spell slots stops being a disaster. Your Fire Bolt now always does something.","Haste is a trap if you break Concentration — a hasted creature that loses the effect is Lethargic and loses its next turn. Cast it on someone who will not be taking hits, or accept the risk on your Paladin."],"irreversible":false},{"level":7,"menu":"2 new spells (4th level unlocked)","choice":"Ice Storm + Dimension Door","alternatives":["Wall of Fire","Greater Invisibility","Polymorph","Banishment","Confusion","Evard's Black Tentacles","Stoneskin"],"reasoning":"Ice Storm is your second AoE nuke and leaves icy ground that knocks enemies Prone; Dimension Door is the escape hatch for when something reaches you.","details":["Ice Storm is the closest thing you get to Storm Gust — area damage plus a lingering hazard surface.","Greater Invisibility on Gale is an extremely strong defensive option: enemies cannot target what they cannot see, and you attack with advantage.","Polymorph turns a dangerous enemy into a sheep. It is a full disable on a failed save."],"irreversible":false},{"level":8,"menu":"Feat, then 2 new spells","choice":"Ability Improvement +2 INT (18 to 20)","alternatives":["War Caster","Alert","Resilient (Constitution)","Elemental Adept","Lucky"],"reasoning":"Caps your spell save DC and spell attack bonus, and sets up Empowered Evocation at level 10 to add +5 damage to every evocation spell.","details":["INT 20 plus Empowered Evocation at 10 means every Fireball, Ice Storm and Cone of Cold gets +5 flat damage on top. This feat is the setup for that.","Do not take Elemental Adept unless you are committing hard to one damage type — it is narrower than it looks."],"irreversible":false},{"level":9,"menu":"2 new spells (5th level unlocked)","choice":"Cone of Cold + Hold Monster","alternatives":["Wall of Stone","Telekinesis","Conjure Elemental","Dominate Person","Cloudkill","Animate Objects"],"reasoning":"Cone of Cold is your Storm Gust — a large cone of cold damage that Sculpt Spells lets you fire through your own front line.","details":["Hold Monster is Hold Person without the humanoid restriction, so it works on the big things. Paralysed target plus your Paladin's melee equals automatic critical hits.","Wall of Stone is the ultimate chokepoint tool and pairs directly with your Paladin's job — you can physically seal a corridor."],"irreversible":false},{"level":10,"menu":"No choice for the subclass feature; a 5th cantrip; 2 new spells","choice":"Empowered Evocation (automatic) | Cantrip: Acid Splash","alternatives":["Cantrip: Bone Chill, Shocking Grasp, Minor Illusion"],"reasoning":"Empowered Evocation adds your INT modifier (+5) to the damage of every evocation spell — a permanent, no-cost damage increase on everything you cast.","details":["With INT 20 this is +5 damage on Fire Bolt, Magic Missile, Fireball, Ice Storm and Cone of Cold. It is the payoff for the two INT feats.","Acid Splash is a small AoE cantrip with a save, so it benefits from Potent Cantrip — free chip damage on two targets when you are out of slots."],"irreversible":false},{"level":11,"menu":"2 new spells (6th level unlocked)","choice":"Chain Lightning + Globe of Invulnerability","alternatives":["Disintegrate","Circle of Death","Otiluke's Freezing Sphere","Flesh to Stone"],"reasoning":"Chain Lightning is your Lord of Vermilion — big multi-target damage that arcs between enemies, boosted by Empowered Evocation.","details":["Globe of Invulnerability is a bubble that blocks incoming spells. Park it over your clustered party in a caster fight and they simply stop taking magic damage.","Disintegrate is the single-target alternative if you want a boss-deleter instead."],"irreversible":false},{"level":12,"menu":"Feat, then 2 new spells","choice":"War Caster","alternatives":["Alert","Resilient (Constitution)","Lucky","Ability Improvement (+2 CON)"],"reasoning":"Advantage on Concentration saves protects Haste, Web and Hypnotic Pattern — by level 12 losing Concentration costs more than any remaining stat point would gain.","details":["Alert is the alternative: acting first as a wizard means Hypnotic Pattern or Fireball lands before the enemy has spread out.","Lucky is the survivability pick and is excellent on a character with low HP."],"irreversible":false}]},{"id":"shadowheart","name":"High Priest","roClass":"Full Support Priest","bg3Build":"Life Domain Cleric 12","role":"Healer / Buffer / Damage Sponge Proxy","badge":"priest","summary":"Your Full Support. Bless is Gloria, Warding Bond is Devotion, Spirit Guardians is Magnus Exorcismus that follows you around. She never dies because nothing wants to hit her, and the Paladin never dies because she is taking half his damage.","stats":{"str":10,"dex":14,"con":16,"int":8,"wis":16,"cha":10},"statNotes":{"str":"10. Enough to carry things. NOT enough for heavy armour without a speed penalty — see the armour note below, this is a deliberate trade.","dex":"14. +2 AC in medium armour and decent initiative. This is why she wears medium armour, not plate.","con":"16. The most important defensive stat she has: HP, Concentration saves for Bless and Spirit Guardians, and she is soaking half the Paladin's damage through Warding Bond.","int":"Dumped entirely.","wis":"16 to start, 20 by level 12. Spell save DC, healing throughput via Disciple of Life, and Perception.","cha":"10, forced up by the Half-Elf +2. Wasted stat, unavoidable on her race."},"statPlan":["Point-buy base (27 points): STR 10, DEX 14, CON 15, INT 8, WIS 15, CHA 8.","Half-Elf racial: +2 CHA (forced), +1 CON, +1 WIS (your two free picks). Result: STR 10, DEX 14, CON 16, INT 8, WIS 16, CHA 10.","Level 8 Ability Improvement +2 WIS: 16 to 18. Level 12 Ability Improvement +2 WIS: 18 to 20.","ARMOUR TRADE-OFF: Life Domain grants heavy armour proficiency, but BG3 penalises your movement speed if you wear heavy armour below its STR requirement (13 or 15). At STR 10 you would be slowed. The build therefore puts her in MEDIUM armour with DEX 14 and gets similar AC without the penalty. If you would rather wear plate, rebuild with STR 15 and drop CON to 14 and WIS to 15 — it is a real option, just a worse one for a support who repositions."],"roMapping":[{"roSkill":"Devotion","bg3":"Warding Bond (2nd-level spell, Cleric 3)","breaks":"One target only, not five. She takes HALF the damage dealt to the bonded ally, and it lasts until Long Rest. Unlike Devotion it does not reduce the damage — it SPLITS it, so she needs the HP and the damage resistances to survive being the sponge."},{"roSkill":"Gloria / Blessing","bg3":"Bless (1st-level, always prepared via Life Domain)","breaks":"+1d4 to attack rolls AND saving throws for 3 allies, but it requires Concentration — she can only hold ONE concentration spell at a time. Bless or Spirit Guardians, never both."},{"roSkill":"Heal / Sanctuary","bg3":"Cure Wounds, Healing Word, Preserve Life","breaks":"Healing in BG3 is weak relative to enemy damage. Healing Word (Bonus Action, at range) to pick someone up off the floor is the correct use; standing and topping people off is a wasted turn. Prevention beats healing here far more than in RO."},{"roSkill":"Magnus Exorcismus","bg3":"Spirit Guardians (3rd-level, Cleric 5)","breaks":"It is centred on HER and MOVES with her, not placed on the ground. It damages everything in radius at the start of their turn AND halves their movement. She has to physically walk into the enemy pack — which is why CON 16 and Warding Bond matter."},{"roSkill":"Kyrie Eleison / Assumptio","bg3":"Death Ward, Sanctuary, Beacon of Hope","breaks":"Death Ward is the closest thing — it survives one lethal hit. Cast it before boss fights, it lasts until Long Rest."},{"roSkill":"Resurrection","bg3":"Revivify (3rd-level, needs 1 Diamond as a material component)","breaks":"Costs a consumable Diamond every cast. Buy every Diamond you see from every vendor. Withers at camp also resurrects for 200g if she is out of diamonds or also dead."}],"levels":[{"level":1,"menu":"Divine Domain, then Cantrips (pick 3), then Prepared Spells","choice":"Domain: Life | Cantrips: Guidance, Sacred Flame, Resistance | Prepared: Healing Word, Guiding Bolt, Command, Sanctuary (Bless is free from the domain)","alternatives":["Domain: Trickery (her default)","Domain: Light","Domain: War","Domain: Tempest","Cantrips: Blade Ward, Thaumaturgy, Light, Produce Flame","Prepared: Cure Wounds, Shield of Faith, Inflict Wounds, Protection from Evil and Good, Create or Destroy Water"],"reasoning":"Life Domain is the Full Support: Disciple of Life adds bonus HP to every healing spell, Bless is permanently prepared for free, and it grants heavy armour proficiency.","details":["SET AT LEVEL 1, AND SHE ARRIVES PRE-BUILT. Cleric subclass is chosen at level 1 in BG3, and Shadowheart's was set to Trickery before you recruited her — so no level-up screen will ever show you a domain menu for her. Withers is the only way to change it, he charges a flat 100 gold at any level, and he only trades at camp.","WAITING COSTS NOTHING PERMANENT. A respec rebuilds the character from level 1 and you re-level back up immediately, keeping all equipment and story progress. Do it early because Life Domain simply plays better, not because delay is expensive — and because rebuilding at level 2 is a minute's work while rebuilding at level 10 means re-picking ten levels of choices.","Guidance is the single most-used cantrip in the game: +1d4 to any ability check out of combat. Cast it before every lockpick, every dialogue check, every jump.","Sacred Flame is her at-will damage. It is a DEX save (no attack roll), so it never misses due to AC — but it also does not benefit from advantage.","Resistance (+1d4 to a saving throw) is the third pick; Blade Ward is the defensive alternative if you prefer.","Prepared spells are re-pickable at any time outside combat, for free. Nothing on the prepared list is a commitment — only cantrips and the domain are locked.","Command is the sleeper pick: 'Drop' disarms an enemy, 'Approach' pulls them out of position. It is a WIS save against your DC."],"irreversible":true},{"level":2,"menu":"No choices (Channel Divinity granted automatically)","choice":"Channel Divinity: Preserve Life + Turn Undead","alternatives":[],"reasoning":"Preserve Life is a free party-wide heal that costs no spell slot — one charge per short rest, and it is the emergency button that saves a wipe.","details":["Preserve Life distributes healing across the party up to half their maximum HP. It will not top up someone already above half — target it when several people are hurt.","Channel Divinity recharges on a SHORT rest. Two short rests per long rest means three uses per day. Do not hoard it.","Turn Undead makes undead flee. Act 2 is full of undead. This is more useful than it sounds."],"irreversible":false},{"level":3,"menu":"Prepared spells (2nd level unlocked)","choice":"Prepare: Warding Bond, Aid, Hold Person, Silence (Spiritual Weapon + Lesser Restoration are free domain spells)","alternatives":["Prayer of Healing","Blindness","Enhance Ability","Protection from Poison"],"reasoning":"Warding Bond is your Devotion and the reason the Paladin is functionally unkillable; Spiritual Weapon is a free Bonus Action attack every turn for the rest of the game.","details":["WARDING BOND RULE: cast it on the Paladin at camp before you set out. It lasts until Long Rest and does not need Concentration. He takes half damage; she takes the other half. She MUST have good HP and ideally damage resistance items for this to be a win.","Spiritual Weapon is a floating mace that attacks as a BONUS ACTION. It costs a slot once and then it is free damage every round. It does not require Concentration. Cast it in nearly every fight.","Aid gives +5 maximum HP to the whole party until Long Rest and scales if cast with a higher slot. Cast it at camp every morning alongside Warding Bond.","Hold Person is a save-or-lose: a paralysed humanoid takes automatic critical hits from every melee attack. Hold Person into Astarion is a delete button."],"irreversible":false},{"level":4,"menu":"Feat, then a 4th cantrip","choice":"Feat: War Caster | Cantrip: Blade Ward","alternatives":["Feat: Ability Improvement (+2 WIS)","Feat: Resilient (Constitution)","Feat: Tough","Feat: Lucky","Cantrip: Thaumaturgy, Light, Produce Flame"],"reasoning":"War Caster gives advantage on Concentration saves, which protects Bless and later Spirit Guardians — the two spells that define her contribution.","details":["Losing Concentration on Spirit Guardians while standing inside a mob is the most common way this character fails. War Caster is the fix.","Resilient (Constitution) is the competing answer — it grants CON save proficiency AND +1 CON. War Caster's advantage is mathematically stronger at her CON 16, and War Caster also lets her cast spells as opportunity attacks.","Do NOT take +2 WIS here. Concentration reliability beats a +1 to save DC."],"irreversible":false},{"level":5,"menu":"Prepared spells (3rd level unlocked)","choice":"Prepare: Spirit Guardians, Mass Healing Word, Remove Curse (Revivify + Beacon of Hope are free domain spells)","alternatives":["Bestow Curse","Glyph of Warding","Protection from Energy","Speak with Dead"],"reasoning":"Spirit Guardians is the biggest single upgrade she ever gets — persistent AoE damage plus movement-halving, centred on her, for one Concentration.","details":["Destroy Undead is also granted automatically at this level.","Spirit Guardians changes how you play her: she stops standing at the back and starts walking into the enemy formation. This is the RO Priest going Magnus and body-blocking, and it is correct.","Revivify becomes a domain spell here and is always prepared. KEEP DIAMONDS IN HER INVENTORY. Buy them from every trader.","Beacon of Hope makes all her healing maximise and gives advantage on WIS saves and death saves. Combine with Preserve Life for an absurd emergency heal."],"irreversible":false},{"level":6,"menu":"No choices","choice":"Blessed Healer + second Channel Divinity charge","alternatives":[],"reasoning":"Blessed Healer means every heal she casts on someone else also heals her — which directly funds the HP she is losing to Warding Bond.","details":["Two Channel Divinity char
