ges per short rest means up to six Preserve Life casts per long rest. Her emergency capacity roughly doubles here."],"irreversible":false},{"level":7,"menu":"Prepared spells (4th level unlocked)","choice":"Prepare: Freedom of Movement, Banishment (Death Ward + Guardian of Faith are free domain spells)","alternatives":["Blight","Divination","Stoneskin (if available)"],"reasoning":"Death Ward as a free domain spell is a pre-cast that survives one lethal hit until Long Rest — put it on the Paladin and on Astarion every morning.","details":["Freedom of Movement makes a target immune to being Restrained, Paralysed, and to difficult terrain — including YOUR OWN Spike Growth. Cast it on the Paladin so he can fight inside the main character's Spike Growth field.","Banishment removes one enemy from the fight entirely on a failed CHA save. It is the answer to any single enemy the party cannot handle yet.","Guardian of Faith is a free stationary damage turret that costs no Concentration. Drop it in a doorway next to the Paladin."],"irreversible":false},{"level":8,"menu":"Feat","choice":"Ability Improvement: +2 WIS (16 to 18)","alternatives":["Resilient (Constitution)","Tough","Lucky","Alert"],"reasoning":"+1 to spell save DC on Hold Person, Command, and Sacred Flame, +1 to every heal via Disciple of Life, and one more prepared spell slot.","details":["Divine Strike is also granted automatically here: +1d8 radiant damage on her weapon attacks once per turn. She is not a weapon attacker, but it makes her mace swings non-embarrassing.","Tough (+2 HP per level, so +24 HP) is the alternative worth considering specifically because of Warding Bond. If she keeps dying from the bond, take Tough."],"irreversible":false},{"level":9,"menu":"Prepared spells (5th level unlocked)","choice":"Prepare: Insect Plague, Planar Ally (Mass Cure Wounds + Greater Restoration are free domain spells)","alternatives":["Flame Strike","Contagion","Dispel Evil and Good"],"reasoning":"Greater Restoration as a free domain spell removes the conditions nothing else in the party can fix, and Mass Cure Wounds is the full-party emergency heal.","details":["Flame Strike is the damage pick if you want a nuke; Insect Plague is chosen because it is a persistent zone that also blocks vision, which is better with a Sharpshooter who ignores cover.","Planar Ally summons a permanent-until-rest ally. It is a free extra body and free action economy."],"irreversible":false},{"level":10,"menu":"Divine Intervention (choose the effect), then a 5th cantrip","choice":"Divine Intervention: choose the healing/revival option | Cantrip: Thaumaturgy","alternatives":["Divine Intervention: the damage option","Divine Intervention: the utility/equipment option","Cantrip: Light, Produce Flame"],"reasoning":"Divine Intervention is effectively once per playthrough — the full-party revive-and-heal is the one that turns a lost fight into a won one.","details":["FLAG: the game asks you to pick ONE intervention and that choice sticks. It is a once-per-long-rest ability on paper but in practice you will use it once, in the fight that is going wrong.","The damage option is a large single nuke; the utility option grants gear. Neither saves a wipe."],"irreversible":true},{"level":11,"menu":"Prepared spells (6th level unlocked)","choice":"Prepare: Heroes' Feast, Blade Barrier","alternatives":["Harm","Planar Ally (greater)","Word of Recall"],"reasoning":"Heroes' Feast gives the entire party bonus maximum HP, immunity to Frightened, and immunity to poison until Long Rest — it is a permanent party-wide buff for one slot.","details":["Heroes' Feast requires a material component in some versions — check her inventory prompt. Cast it at camp every morning from Act 3 onward.","Blade Barrier is a wall of spinning blades — pure chokepoint control, and it pairs directly with the Paladin's job."],"irreversible":false},{"level":12,"menu":"Feat","choice":"Ability Improvement: +2 WIS (18 to 20)","alternatives":["Resilient (Constitution)","Tough","Lucky","Warcaster (if not taken)"],"reasoning":"Caps her spell save DC and healing bonus, and gives a final extra prepared spell.","details":["If she has been dying to Warding Bond damage through Acts 2 and 3, take Tough here instead and accept a WIS of 18 — a dead cleric has a save DC of zero."],"irreversible":false}]},{"id":"paladin","name":"Crusader","roClass":"Crusader","bg3Build":"Oath of the Ancients Paladin 9 / Battle Master Fighter 3","role":"Tank / Chokepoint Lockdown","badge":"crusader","summary":"The Crusader with a spear. He stands in a doorway, forces enemies to attack him, and physically prevents them from walking past. Sentinel plus Polearm Master is the closest BG3 gets to a hard taunt, and Warding Bond from Shadowheart means he takes half of everything anyway.","stats":{"str":17,"dex":10,"con":14,"int":9,"wis":10,"cha":14},"statNotes":{"str":"Primary. Attack and damage with a glaive/halberd, plus Athletics for shoving enemies off cliffs and into Spike Growth.","dex":"10. He wears heavy armour, which ignores DEX for AC entirely. Dumped on purpose.","con":"14. HP and Concentration for Bless and Misty Step-adjacent buffs. Warding Bond means he needs less of this than you would expect.","int":"Dumped (Githyanki forces +1 here).","wis":"10. His weakest save — Aura of Protection at level 6 patches this for the whole party.","cha":"14. Not for talking: Aura of Protection adds his CHA modifier to the saving throws of every ally within range. +2 to all saves, party-wide, is the best defensive ability in the game."},"statPlan":["Point-buy base (27 points): STR 15, DEX 10, CON 14, INT 8, WIS 10, CHA 14.","Githyanki racial (if you respec Lae'zel): +2 STR, +1 INT. Result: STR 17, DEX 10, CON 14, INT 9, WIS 10, CHA 14.","If you use a different body (Karlach, a hireling, Minthara), apply whatever racial you get to STR first, then CHA.","GITHYANKI BONUS: Lae'zel keeps her racial spells through a respec, including a free Misty Step around level 5. That is separate from the Misty Step your Ancients oath grants, so the chokepoint tank gets two teleports per rest and only one of them costs a spell slot.","A respec at Withers changes MECHANICS ONLY. Lae'zel's dialogue, personal questline, and Githyanki story beats are completely unaffected by turning her into a Paladin.","STR stays at 17 all game. Both feats go to Sentinel and Polearm Master instead of an ASI. You fix STR with Elixirs of Hill Giant Strength (sets STR to 21), which are cheap and sold constantly. Drink one every morning.","ELIXIR NOTE: an Elixir SETS your STR to a value, it does not add. Once you are drinking Hill Giant Strength (21), your base 17 is irrelevant — this is what frees both feats."],"roMapping":[{"roSkill":"Provoke","bg3":"Compelled Duel (Paladin 1 spell) + Goading Attack (Battle Master maneuver)","breaks":"Neither is a hard taunt. Compelled Duel gives the target disadvantage on attacks against anyone else and stops it moving away — but it gets a WIS save. Goading Attack gives disadvantage on attacks against others. BG3 has no forced-target mechanic at all; you are manipulating odds, not compelling behaviour."},{"roSkill":"Devotion (receiving end)","bg3":"Warding Bond cast on him by Shadowheart","breaks":"In RO the Crusader casts Devotion outward. Here he is the RECEIVER — Shadowheart is the one who takes the damage. The role is inverted."},{"roSkill":"Grand Cross / Holy Cross","bg3":"Divine Smite","breaks":"Divine Smite is not an AoE. It is a spell slot burned to add radiant damage to a single melee hit, decided AFTER you see the roll. Save it for critical hits — a crit doubles the smite dice."},{"roSkill":"Spear Quicken / Spear Boomerang","bg3":"Polearm Master (bonus action butt-end attack, plus opportunity attacks at reach)","breaks":"No ranged spear throw. Polearm Master's real value is the reach opportunity attack: enemies get hit when they ENTER your reach, before they can close."},{"roSkill":"Shield Boomerang / Shield Chain","bg3":"Not taken — this build is two-handed polearm","breaks":"You can build a shield Paladin instead, but Sentinel plus Polearm Master lockdown is far stronger for chokepoint work than the +2 AC a shield gives."},{"roSkill":"Auto Guard / Reflect Shield","bg3":"Aura of Protection (level 6) + Aura of Warding (level 10)","breaks":"These are party-wide passive auras with no activation. Aura of Warding (Ancients) gives everyone near him resistance to spell damage — that is half damage from every fireball in the game, for the whole party."}],"levels":[{"level":1,"menu":"Sacred Oath (BG3 asks at level 1, not level 3)","choice":"Oath of the Ancients","alternatives":["Oath of Devotion","Oath of Vengeance","Oathbreaker (not selectable at creation)"],"reasoning":"Ancients gives Aura of Warding at level 10 — resistance to spell damage for the whole party — which is the single best defensive aura available to any class.","details":["IRREVERSIBLE-ISH AND STORY-RELEVANT: breaking your Oath turns you into an Oathbreaker and you lose all oath features. You can pay the Oathbreaker Knight at camp to restore it (cost scales, roughly 1000-2000g).","ANCIENTS OATH TENETS — the things that break it: showing cruelty, killing surrendered or helpless creatures, wanton destruction of nature, betraying an innocent. In practice: do not execute prisoners, do not side with obviously cruel factions, and be careful in the Act 1 Grove decision.","PARTY CONFLICT WARNING: if you are running Minthara as the Paladin body, the goblin-camp path that recruits her involves attacking the Grove — which is exactly the kind of act that breaks an Ancients oath. Minthara-as-Ancients is thematically and mechanically awkward. Use Lae'zel, Karlach, or a hireling instead.","Devotion is the alternative if you want Sacred Weapon (add CHA to attack rolls). It is a strong pick and arguably better offence. Ancients is better defence and better for the whole party."],"irreversible":true},{"level":2,"menu":"Fighting Style, then Prepared Spells","choice":"Fighting Style: Great Weapon Fighting | Prepare: Compelled Duel, Shield of Faith, Bless (Ensnaring Strike + Speak with Animals are free Ancients oath spells)","alternatives":["Fighting Style: Defence","Fighting Style: Protection","Fighting Style: Dueling","Prepare: Wrathful Smite, Searing Smite, Heroism, Divine Favour, Cure Wounds"],"reasoning":"Great Weapon Fighting rerolls 1s and 2s on your glaive's damage dice, which meaningfully smooths out a two-handed weapon's swingy damage.","details":["Divine Smite unlocks here. It is not a prepared spell — it is a prompt that appears AFTER you hit. Answer 'yes' on critical hits, 'no' on ordinary hits against trash.","Compelled Duel is your Provoke: the target gets disadvantage attacking anyone but you, and cannot willingly move away from you. It is a WIS save each turn, so it is unreliable against high-WIS enemies — this is the biggest analogy break from RO Provoke.","Defence (+1 AC) is the safe alternative fighting style. You get it anyway at Fighter 1, which is why Great Weapon Fighting is taken here."],"irreversible":false},{"level":3,"menu":"No choices (Channel Oath granted automatically)","choice":"Channel Oath: Nature's Wrath + Turn the Faithless","alternatives":[],"reasoning":"Nature's Wrath restrains enemies in an area — restrained enemies cannot move and are attacked with advantage, which is chokepoint control on a free charge.","details":["Ancients grants both channel options rather than making you choose. Nature's Wrath is the combat one; Turn the Faithless routs fiends and fey.","Channel Oath recharges on a SHORT rest."],"irreversible":false},{"level":4,"menu":"Feat","choice":"Sentinel","alternatives":["Polearm Master","Great Weapon Master","Ability Improvement (+2 STR)","Tough"],"reasoning":"Sentinel is the closest thing to a real taunt in the game: when you hit a creature with an opportunity attack its speed drops to zero, and you get an opportunity attack even against enemies who Disengage.","details":["Sentinel's third clause is the sleeper: when an enemy attacks an ALLY within your reach, you get a free reaction attack against it. Standing next to Shadowheart means anything that swings at her gets hit by you.","Sentinel + a glaive's 3m reach means enemies are stopped a full square before they reach your squishies.","You specified Sentinel and it is correct. Polearm Master at level 8 completes the combo.","Great Weapon Master (-5 hit / +10 damage) is the damage alternative — you are building a tank, not a damage dealer, so lockdown wins."],"irreversible":false},{"level":5,"menu":"No choices for the feature; Prepared spells (2nd level unlocked)","choice":"Extra Attack (automatic) | Prepare: Aid, Magic Weapon (Misty Step + Moonbeam are free Ancients oath spells)","alternatives":["Prepare: Branding Smite, Find Steed, Protection from Poison"],"reasoning":"Extra Attack doubles his Action, and with Polearm Master later that becomes three attacks per turn.","details":["MISTY STEP as a free oath spell is a big deal on a tank — it lets him teleport to the chokepoint on turn one instead of walking for two rounds, or teleport out when he is being focused.","Moonbeam is a movable damage zone. Park it on the chokepoint he is holding."],"irreversible":false},{"level":6,"menu":"No choices","choice":"Aura of Protection (automatic)","alternatives":[],"reasoning":"Every ally within range adds his CHA modifier (+2) to EVERY saving throw — this is why he has CHA 14 and it is the best party-wide defence in the game.","details":["Positioning changes here. He is no longer just a wall; he is a mobile buff radius. Keep the party clustered near him where the fight allows.","This stacks with Bless (+1d4 to saves) from Shadowheart. Your party's save success rate roughly doubles across levels 6-7."],"irreversible":false},{"level":7,"menu":"Fighter — Fighting Style (multiclass dip: select Fighter at the level-up screen)","choice":"Fighter 1 | Fighting Style: Defence","alternatives":["Fighting Style: Protection","Fighting Style: Great Weapon Fighting (if not taken)","Stay pure Paladin"],"reasoning":"+1 AC on the character who is being attacked deliberately, plus Second Wind as a free Bonus Action self-heal.","details":["MULTICLASS WARNING: click the multiclass option and choose Fighter. It is easy to autopilot into Paladin 7.","TIMING NOTE: taking the Fighter dip AFTER Paladin 6 is deliberate — Aura of Protection at Paladin 6 is too important to delay. If you would rather have Action Surge earlier, you can dip at Paladin 5 instead and push Aura to character level 8. Both are defensible; this table delays the dip.","Protection (impose disadvantage on an attack against an adjacent ally, as a reaction) requires a SHIELD, which this build does not use."],"irreversible":false},{"level":8,"menu":"No choices","choice":"Fighter 2 | Action Surge (automatic)","alternatives":[],"reasoning":"An extra full Action per short rest — on a Paladin that means two extra attacks, or two extra chances to land a Divine Smite crit.","details":["On a tank, Action Surge is also an emergency: an extra Action can be used to Dash to a collapsing flank or to cast a spell in the same turn you attack."],"irreversible":false},{"level":9,"menu":"Martial Archetype, then Maneuvers (pick 3)","choice":"Fighter 3 | Battle Master | Maneuvers: Goading Attack, Trip Attack, Riposte","alternatives":["Archetype: Champion","Archetype: Eldritch Knight","Maneuvers: Menacing Attack, Pushing Attack, Precision Attack, Disarming Attack, Sweeping Attack, Rally"],"reasoning":"Goading Attack is your second Provoke, Trip Attack knocks enemies Prone (melee attacks against Prone targets have advantage), and Riposte is a free counterattack when something misses you.","details":["IRREVERSIBLE without respec.","Goading Attack: the target has disadvantage on attacks against anyone except you. Combined with Compelled Duel, you have two independent Provoke effects with different save types — cast Compelled Duel on the dangerous one, Goad the rest.","Trip Attack is arguably the strongest maneuver in the game. Prone enemies lose their turn standing up and are hit with advantage by everyone.","Riposte is pure value on a character who is deliberately being attacked all the time.","Pushing Attack is the honourable mention — shoving enemies into the main character's Spike Growth or off a ledge. Swap it in if your maps have cliffs.","You get 4 Superiority Dice, recharging on a short rest."],"irreversible":true},{"level":10,"menu":"No choices (back to Paladin — select Paladin, not Fighter)","choice":"Paladin 7 | Aura of Warding (automatic)","alternatives":[],"reasoning":"Everyone in his aura takes HALF damage from spells — this is the Ancients payoff and it trivialises enemy casters for the entire party.","details":["Combined with Astarion's Evasion and the party clustering for Aura of Protection, enemy AoE spells stop being a threat around here.","This is the single best reason to have picked Ancients over Devotion or Vengeance."],"irreversible":false},{"level":11,"menu":"Feat","choice":"Paladin 8 | Polearm Master","alternatives":["Ability Improvement (+2 STR)","Great Weapon Master","Tough","Resilient (Wisdom)"],"reasoning":"Completes the lockdown: you get an opportunity attack when an enemy ENTERS your reach (not just when it leaves), and Sentinel then sets its speed to zero — enemies literally cannot walk past you.","details":["Polearm Master also grants a Bonus Action butt-end attack (1d4 + STR) every turn. That is a third attack per round for free.","REQUIREMENT: you must be wielding a glaive, halberd, quarterstaff, or spear. If he is holding a greatsword this feat does nothing. Check his weapon before you take it.","THE COMBO IN FULL: enemy walks toward the party, enters your 3m reach, Polearm Master triggers an opportunity attack, the hit triggers Sentinel, its speed becomes 0, and it is now stuck in front of you at reach, unable to close. This is the chokepoint.","You are skipping the STR ASI here on purpose — Elixirs of Hill Giant Strength set STR to 21, which is better than 19."],"irreversible":false},{"level":12,"menu":"Prepared spells (3rd level unlocked)","choice":"Paladin 9 | Prepare: Elemental Weapon, Blinding Smite (Plant Growth + Protection from Energy are free Ancients oath spells)","alternatives":["Prepare: Crusader's Mantle, Daylight, Remove Curse"],"reasoning":"Third-level slots mostly exist to fuel bigger Divine Smites, but Elemental Weapon is a solid until-rest damage buff and Blinding Smite is a save-or-lose rider.","details":["Plant Growth as a free oath spell is a huge area of difficult terrain — it stacks conceptually with the main character's Spike Growth to make an entire approach lane unusable.","Crusader's Mantle (allies near you deal +1d4 radiant) is the alternative if your party is clustered anyway for the auras. Genuinely close call.","Reminder: your 3rd-level slots are usually better spent as Divine Smite fuel on critical hits than on casting these."],"irreversible":false}]}]},"gear":{"meta":{"disclaimer":"Locations are written from knowledge of a patched game; Larian moves vendors and loot between patches. Verify in-game rather than trusting the location text. The EFFECT column is what the build actually depends on — if an item has moved or been renamed, the effect is still what you are shopping for.","vendorTip":"Vendors restock after every long rest and their attitude affects prices — send whoever has the highest Charisma to trade. You can also pickpocket vendors with Astarion (Sleight of Hand expertise) and then buy the rest legitimately.","actNote":"You can return to Act 1 zones during Act 2. You CANNOT return to Acts 1 or 2 once you travel to Act 3 (Rivington). Clear every Act 1 and Act 2 shopping list before that transition."},"act1":[{"item":"Titanstring Bow","slot":"Ranged Weapon","wearer":"main","location":"Zhentarim Hideout (under the Waukeen's Rest area) — Brem, vendor. Roughly 400-600g.","effect":"Adds your STRENGTH modifier to ranged damage, on top of DEX.","replaces":"Starting longbow","missable":false,"note":"You have STR 8 (-1), so out of the box this is a DOWNGRADE. It becomes the best bow in Act 1 the moment you pair it with an Elixir of Hill Giant Strength (STR 21 = +5 damage per arrow) or the Club of Hill Giant Strength held in your off-hand slot. Buy the elixirs, drink one every morning. This is a real gold cost — budget for it."},{"item":"Gloves of Archery","slot":"Gloves","wearer":"main","location":"Emerald Grove — Arron, the general trader (verify; may also appear on other Act 1 vendors).","effect":"+2 damage with ranged weapons and proficiency with longbows/shortbows.","replaces":"Empty glove slot","missable":false,"note":"Flat +2 per arrow applies to every shot, so with 3 attacks a turn it is +6. Cheap and immediately good."},{"item":"Elixir of Hill Giant Strength","slot":"Consumable","wearer":"paladin","location":"Sold by almost every Act 1 vendor (Arron in the Grove, Dammon, Zhentarim). Also craftable from Salts of Hill Giant Strength.","effect":"Sets Strength to 21 until Long Rest.","replaces":"Nothing","missable":false,"note":"This is the item that lets the Paladin skip his STR ASI and take Polearm Master instead. Buy every one you see, all game. Also the enabler for the Titanstring Bow if you would rather drink them on the main character — you cannot easily supply both, so pick one. Recommendation: Paladin gets the elixirs, main character uses the Club of Hill Giant Strength trick or just skips Titanstring."},{"item":"Club of Hill Giant Strength","slot":"Off-hand / carried","wearer":"main","location":"Act 1 — from the Githyanki patrol area / Ethel's teahouse region (verify).","effect":"Sets Strength to 19 while equipped.","replaces":"Nothing","missable":true,"note":"The non-consumable way to power the Titanstring Bow. You cannot hold a club and a longbow at the same time, so this works via the weapon-swap slot: it is fiddly. If it annoys you, skip Titanstring entirely and use The Dead Shot in Act 2."},{"item":"Hag's Hair (Auntie Ethel)","slot":"One-time permanent","wearer":"main","location":"Sussur Bog — Auntie Ethel. Obtained either by sparing her for it, or by looting it after you kill her (verify your route).","effect":"Permanent +1 to one ability score of your choice.","replaces":"Nothing","missable":true,"note":"IRREVERSIBLE AND ONE PER PLAYTHROUGH. Put it in the main character's DEXTERITY, taking 17 to 18. This is the only way the level 8 ASI reaches DEX 20 instead of a wasted 19. Do not let a companion take it."},{"item":"Strange Conduit Ring","slot":"Ring","wearer":"main","location":"Underdark — Myconid Colony, reward from Sovereign Spaw's quest line (kill Nere / the duergar).","effect":"+1d4 psychic damage on weapon attacks while you are Concentrating on a spell.","replaces":"Empty ring slot","missable":true,"note":"You are Concentrating on Hunter's Mark essentially permanently, so this is +1d4 on every single arrow. With 3 attacks a turn that is a large, quiet damage increase. One of the best Act 1 items for this specific build."},{"item":"Hellrider's Pride","slot":"Gloves","wearer":"shadowheart","location":"Emerald Grove — reward from Zevlor for resolving the tiefling/druid situation.","effect":"Creatures you heal gain Blade Ward (resistance to physical damage) until end of next turn.","replaces":"Empty glove slot","missable":true,"note":"Turns every Healing Word into a defensive buff. Combined with Whispering Promise below, a single Bonus Action heal buffs and protects at the same time."},{"item":"Whispering Promise","slot":"Ring","wearer":"shadowheart","location":"Act 1 vendor (commonly the goblin camp trader or Grove trader — verify).","effect":"Creatures you heal gain Bless (+1d4 to attack rolls and saves).","replaces":"Empty ring slot","missable":false,"note":"This is the key to the Sharpshooter maths. Shadowheart heals the main character for 1 HP with a Bonus Action and the main character gets Bless without her spending Concentration on it — leaving her Concentration free for Spirit Guardians."},{"item":"Adamantine Scale Mail","slot":"Chest (Medium armour)","wearer":"shadowheart","location":"Grymforge — Adamantine Forge. Requires Mithral Ore + the Scale Mail mould.","effect":"Solid AC, and critical hits against the wearer become normal hits.","replaces":"Starting scale mail / chain shirt","missable":true,"note":"Medium armour, so no STR requirement and it uses her DEX 14. 'Cannot be critically hit' is enormous on the character carrying Warding Bond. ONE-TIME RESOURCE: you can only forge a limited number of items (usually 2) because Mithral Ore is scarce. Spend your moulds on this and the Adamantine Splint or Shield for the Paladin."},{"item":"Adamantine Splint Armour","slot":"Chest (Heavy armour)","wearer":"paladin","location":"Grymforge — Adamantine Forge. Requires Mithral Ore + the Splint mould.","effect":"AC 18 flat, and critical hits against the wearer become normal hits.","replaces":"Starting chain mail / scale mail","missable":true,"note":"Requires STR 15 to avoid a movement penalty — his base is 17, and he is drinking Hill Giant Strength elixirs anyway, so this is free for him. The anti-crit clause is the single best tanking property in Act 1. Competes with the Adamantine Shield for your limited Mithral Ore — take the armour, since this build is two-handed."},{"item":"The Blood of Lathander","slot":"Weapon (Mace) — or give to Shadowheart as a stat stick","wearer":"shadowheart","location":"Rosymorn Monastery (Mountain Pass route) — solve the sunlight/mural puzzle in the Githyanki Creche area.","effect":"Legendary mace: +1d4 radiant damage, casts Sunbeam, and once per rest it revives the whole party at 1 HP when someone would die.","replaces":"Any starting mace","missable":true,"note":"MISSABLE: only reachable if you take the Mountain Pass / Creche route in Act 1. If you go straight to Act 2 through the Underdark and never come back, you lose it permanently. The auto-revive clause has saved more runs than any other Act 1 item."},{"item":"Boots of Striding","slot":"Boots","wearer":"paladin","location":"Act 1 vendors (Grove / Zhentarim).","effect":"Cannot be knocked Prone while Concentrating, and grants a movement bonus.","replaces":"Starting boots","missable":false,"note":"A tank who gets knocked prone has failed at being a wall. Cheap fix."},{"item":"Amulet of Misty Step","slot":"Amulet","wearer":"main","location":"Underdark (commonly around the Arcane Tower / Underdark vendors — verify).","effect":"Grants the Misty Step spell (Bonus Action teleport) once per Short Rest.","replaces":"Empty amulet slot","missable":true,"note":"This is the archer's panic button and his high-ground button. Teleport to the top of a ledge on turn one, or teleport out when melee reaches you. The Paladin gets Misty Step for free from the Ancients oath, so it goes to the main character."},{"item":"Caustic Band","slot":"Ring","wearer":"astarion","location":"Act 1 vendor (Zhentarim Hideout — verify).","effect":"+2 acid damage on weapon attacks.","replaces":"Empty ring slot","missable":false,"note":"Flat damage per hit. Astarion makes 3 attacks in a burst turn, so this is +6 on his opener. Cheap filler until Act 3."},{"item":"Basic / Malefic / Drow Poison (coatings)","slot":"Consumable","wearer":"astarion","location":"Every Act 1 vendor; Drow Poison from the Underdark.","effect":"Applied as a Bonus Action; adds damage or an unconsciousness save to your next several hits.","replaces":"Nothing","missable":false,"note":"This is your Enchant Poison. Astarion should have a coating on his daggers in every real fight. Buy them constantly — they are cheap and you will always be short."},{"item":"Every Wizard scroll you can find or buy","slot":"Consumable (scribe into spellbook)","wearer":"gale","location":"Every vendor in every act, plus loot. Arron in the Grove, the Zhentarim, and any trader with a scrolls tab.","effect":"Scribing a Wizard scroll adds that spell to Gale's spellbook PERMANENTLY.","replaces":"Nothing","missable":false,"note":"THIS IS GALE'S REAL PROGRESSION and it is more important than any single item on this list. Wizards are the only class that learns spells from scrolls. Priority buys: Misty Step, Mirror Image, Knock, Haste, Hypnotic Pattern, Counterspell. Knock especially if you are benching Astarion — it is your replacement lockpick."},{"item":"Spellsparkler","slot":"Weapon (Quarterstaff)","wearer":"gale","location":"Act 1 — commonly associated with the Arcane Tower / Underdark area (verify).","effect":"Builds Lightning Charges when you cast, adding bonus lightning damage to your next hit.","replaces":"Starting quarterstaff","missable":true,"note":"A caster staff that rewards casting frequently. Confidence on the exact location is low — treat it as 'a lightning-charge staff exists in Act 1', and take it if you see it."},{"item":"Diamonds","slot":"Consumable (spell component)","wearer":"shadowheart","location":"Every vendor with a gems tab, all acts.","effect":"Required material component for Revivify.","replaces":"Nothing","missable":false,"note":"Buy every Diamond you ever see. Being out of Diamonds is the difference between a bad round and a reload. Keep at least 3 in Shadowheart's inventory at all times."}],"act2":[{"item":"The Dead Shot","slot":"Ranged Weapon","wearer":"main","location":"Act 2 — Last Light Inn quartermaster / Moonrise Towers vendor (verify).","effect":"Longbow with a bonus to attack rolls and improved critical range.","replaces":"Titanstring Bow","missable":false,"note":"The upgrade path if you got tired of managing Hill Giant Strength for Titanstring. The bonus to hit directly offsets Sharpshooter's -5, which is worth more than raw damage on a Sharpshooter build."},{"item":"Risky Ring","slot":"Ring","wearer":"main","location":"Moonrise Towers — Araj Oblodra. She will only trade it if Astarion (or another party member) drinks her blood.","effect":"Advantage on ALL attack rolls; disadvantage on saving throws.","replaces":"Caustic Band or an empty ring slot","missable":true,"note":"PERMANENT ADVANTAGE is the best possible item for a Sharpshooter — advantage roughly cancels the -5 penalty on its own. The disadvantage on saves is mitigated by the Paladin's Aura of Protection (+2) and Bless (+1d4). CONDITIONAL: requires agreeing to Araj's request, which has a story/companion-approval cost with Astarion. Flag this before you commit."},{"item":"Boots of Stormy Clamour","slot":"Boots","wearer":"shadowheart","location":"Act 2 (Moonrise Towers area — verify).","effect":"Enemies affected by your conditions gain Reverberation stacks; enough stacks knock them Prone.","replaces":"Starting boots","missable":true,"note":"Pairs with Spirit Guardians, which applies a condition to everything around her every single turn. She becomes a walking crowd-control aura on top of the damage."},{"item":"Callous Glow Ring","slot":"Ring","wearer":"main","location":"Act 2 (Moonrise / Last Light vendor — verify).","effect":"+2 radiant damage against creatures that are Illuminated.","replaces":"Empty ring slot","missable":true,"note":"Act 2 is the Shadow-Cursed Lands and you will be carrying light sources constantly, so 'Illuminated' is easier to satisfy than it sounds. Flat +2 on every arrow."},{"item":"Dark Justiciar Half-Plate / Mask","slot":"Chest / Head","wearer":"shadowheart","location":"Gauntlet of Shar — Dark Justiciar gear, and the Shar quest line rewards.","effect":"Strong medium armour with Shar-themed bonuses.","replaces":"Adamantine Scale Mail (compare AC — the Adamantine anti-crit clause is often still better)","missable":true,"note":"Compare these directly against Adamantine Scale Mail. 'Cannot be critically hit' is usually worth more than 1 point of AC on the Warding Bond carrier. Keep whichever you prefer; the Gauntlet gear is thematically hers regardless."},{"item":"Cloak of Protection","slot":"Cloak","wearer":"paladin","location":"Act 2 vendors (verify).","effect":"+1 AC and +1 to all saving throws.","replaces":"Starting cloak","missable":false,"note":"Boring and excellent. Put it on whoever is being attacked most; if you find two, the second goes to Shadowheart."},{"item":"Spellcrux Amulet","slot":"Amulet","wearer":"shadowheart","location":"Act 2 (verify).","effect":"Once per Long Rest, recover one expended spell slot.","replaces":"Empty amulet slot","missable":true,"note":"One extra Spirit Guardians or Revivify per day. Good until the Amulet of Greater Health appears in Act 3."},{"item":"Sentinel Shield","slot":"Shield","wearer":"paladin","location":"Act 2 (verify).","effect":"Advantage on Initiative and Perception.","replaces":"Nothing — he is two-handed","missable":true,"note":"Listed only so you know to SKIP it. A two-handed Polearm Master build cannot use a shield. If you decide to run him sword-and-board instead, this is the shield you want."}],"act3":[{"item":"Bhaalist Armour","slot":"Chest","wearer":"astarion","location":"Temple of Bhaal, beneath the Undercity — found during the Orin / Murder Tribunal questline.","effect":"Emits an aura that makes nearby enemies VULNERABLE to piercing damage (they take double).","replaces":"Any light armour he is wearing","missable":true,"note":"The single strongest item in the game for this party. Piercing vulnerability doubles his dagger damage AND doubles his Sneak Attack dice. The aura is small (about 2m), so it only helps allies standing next to him — your archer is far away and will not benefit. Astarion wears it for himself."},{"item":"Crimson Mischief","slot":"Main-hand (Shortsword)","wearer":"astarion","location":"Dropped by Orin the Red (Act 3 Temple of Bhaal boss).","effect":"+1d4 piercing against targets with full HP, and an extra off-hand attack rider.","replaces":"Any dagger","missable":false,"note":"Piercing damage, so it doubles inside the Bhaalist Armour aura. This plus Bloodthirst is the intended endgame pair."},{"item":"Bloodthirst","slot":"Off-hand (Dagger)","wearer":"astarion","location":"Also from the Orin encounter / Bhaal temple area.","effect":"+2 to attack, and improved critical range.","replaces":"Any off-hand dagger","missable":false,"note":"Stacks its crit range with Champion's Improved Critical, pushing his crit chance meaningfully higher — and a crit doubles all 5d6 of Sneak Attack."},{"item":"Killer's Sweetheart","slot":"Ring","wearer":"astarion","location":"Act 3 — Devil's Fee (Helsik's shop) in Lower City (verify).","effect":"After you kill a creature, your next attack roll is an automatic critical hit.","replaces":"Caustic Band","missable":true,"note":"Guaranteed crits on a 5d6 Sneak Attack character. Kill a minion, then delete the boss. This is the RO 'crit build without a crit stat' answer."},{"item":"Helldusk Armour","slot":"Chest (Heavy)","wearer":"paladin","location":"Raphael's House of Hope (Act 3) — the vault, during the Orphic Hammer heist.","effect":"AC 21, resistance to fire, advantage on saves vs spells, and it cannot be removed by enemy effects.","replaces":"Adamantine Splint Armour","missable":true,"note":"The best heavy armour in the game. MISSABLE: the House of Hope is only reachable via a specific questline (Helsik's ritual in the Devil's Fee, or accepting Raphael's deal path). If you skip the House of Hope you lose this, the Gloves of Soul Catching, and the Amulet of Greater Health all at once. Do not skip it."},{"item":"Gloves of Soul Catching","slot":"Gloves","wearer":"paladin","location":"Raphael's House of Hope (Act 3).","effect":"+10 temporary HP or +1d10 psychic damage on unarmed/melee hits, plus healing on hit.","replaces":"Whatever gloves he is wearing","missable":true,"note":"Self-sustain on the tank means Shadowheart spends fewer turns healing him and more turns on Spirit Guardians."},{"item":"Amulet of Greater Health","slot":"Amulet","wearer":"shadowheart","location":"Raphael's House of Hope (Act 3) — vault.","effect":"Sets CONSTITUTION to 23 and grants advantage on Constitution saving throws.","replaces":"Spellcrux Amulet","missable":true,"note":"GIVE THIS TO SHADOWHEART, not the Paladin. CON 23 means a massive HP pool (she is soaking half the Paladin's damage via Warding Bond) plus near-unbreakable Concentration on Spirit Guardians. This single item fixes both of her weaknesses at once."},{"item":"Gontr Mael","slot":"Ranged Weapon (Legendary longbow)","wearer":"main","location":"Act 3 — Lorroakan / Ramazith's Tower questline area (verify; this one moves between patches).","effect":"Legendary longbow with bonus radiant damage and a free flight/utility effect.","replaces":"The Dead Shot","missable":true,"note":"The endgame bow. If you cannot find it, The Dead Shot carries you to the credits perfectly well — bows matter less than your riders (Sharpshooter, Hunter's Mark, Strange Conduit, Callous Glow) on this build."},{"item":"Mirror of Loss","slot":"One-time permanent","wearer":"main","location":"Act 3 — hidden Sharran sanctum beneath Sharess' Caress, Lower City.","effect":"Permanent +2 to one ability score of your choice, once per character.","replaces":"Nothing","missable":true,"note":"IRREVERSIBLE, and each character can only use it once. STORY WARNING: using it has consequences for Shadowheart's personal questline depending on where she is in it — read the prompt carefully before you let her near it. Put the main character's +2 into DEX if you have not reached 20; otherwise into CON or WIS."},{"item":"Armour of Agility","slot":"Chest (Medium)","wearer":"shadowheart","location":"Act 3 vendors, Lower City (verify).","effect":"Medium armour that allows your full DEX bonus to AC rather than capping at +2.","replaces":"Adamantine Scale Mail / Dark Justiciar Half-Plate","missable":false,"note":"The clean answer to her STR 10 heavy-armour problem. Compare its AC against Adamantine's anti-crit clause and pick per fight if you are being thorough."},{"item":"Band of the Mystic Scoundrel","slot":"Ring","wearer":"shadowheart","location":"Act 3 — Circus of the Last Days / Lower City vendor (verify).","effect":"After a weapon attack, you can cast Illusion or Enchantment spells as a Bonus Action.","replaces":"Whispering Promise (situationally)","missable":true,"note":"Lets her attack and then Hold Person or Command in the same turn. Strong, but do not drop Whispering Promise for it unless you have a second Bless source."},{"item":"Ring of Regeneration","slot":"Ring","wearer":"shadowheart","location":"Act 3 vendors (verify).","effect":"Regain HP at the start of each turn.","replaces":"Empty ring slot","missable":false,"note":"Passive sustain for the Warding Bond sponge. Also ticks out of combat, saving camp supplies."},{"item":"Markoheshkir","slot":"Weapon (Quarterstaff, Legendary)","wearer":"gale","location":"Act 3 — Ramazith's Tower / Lorroakan questline in the Lower City (verify).","effect":"Legendary staff: once per rest, empower one elemental damage type for the day, plus a large bonus to spellcasting.","replaces":"Spellsparkler","missable":true,"note":"Widely considered the best wizard weapon in the game. Pair the elemental attunement with whichever school you are leaning on that day."},{"item":"Robe of the Weave","slot":"Chest (Clothing)","wearer":"gale","location":"Act 3 — the same Ramazith's Tower / Lorroakan area (verify).","effect":"Bonus to spell save DC and spell attack rolls, plus damage resistances.","replaces":"Any robe he is wearing","missable":true,"note":"Spell save DC is the stat that decides whether your Fireball does full damage and whether Hold Monster lands. Direct upgrade to everything he does."},{"item":"Hat of Fire Acuity","slot":"Head","wearer":"gale","location":"Act 3 vendors (verify).","effect":"Dealing fire damage builds Arcane Acuity, which sharply raises your spell save DC for a few turns.","replaces":"Empty head slot","missable":true,"note":"Fireball into the hat's acuity stacks means your NEXT control spell lands against a badly inflated DC. This is the strongest single combo available to a fire-focused Evocation wizard."},{"item":"Helldusk Gloves / Boots","slot":"Gloves / Boots","wearer":"paladin","location":"Act 3 — House of Hope and related Hells content.","effect":"Fire damage riders and immunity to being knocked Prone / difficult terrain.","replaces":"Boots of Striding","missable":true,"note":"The prone immunity is the relevant part — a chokepoint tank that can be knocked over is not a chokepoint."}]},"rotations":{"meta":{"actionEconomy":"Every turn you get exactly: 1 Action, 1 Bonus Action, 1 Movement, and 1 Reaction (used on someone else's turn). There is no cast time, no ASPD, no delay. 'Rotation' in BG3 means 'how do I spend these four things', not 'what order do I mash keys'.","concentrationRule":"One Concentration spell per character at a time. Casting a second one cancels the first. This is the hardest constraint in the game and most rotation mistakes are Concentration mistakes.","restRule":"Short Rest (2 per day) recharges Action Surge, Channel Divinity, Channel Oath, Second Wind, and some item charges. Long Rest recharges spell slots and advances the story. Take short rests aggressively — hoarding them is a beginner mistake."},"rotations":[{"characterId":"main","name":"Sniper — Hunter Ranger 12","preCombat":["Drink an Elixir of Hill Giant Strength if you are running the Titanstring Bow (this lasts until Long Rest, so do it at camp).","Cast Longstrider on the whole party (lasts until Long Rest, free out of combat).","Summon your Beast Tamer familiar (Find Familiar) — it persists and costs nothing to keep.","Position on HIGH GROUND before triggering the fight. Sharpshooter removes the high-ground penalty and elevation gives you range and line of sight.","Ungroup from the party and sneak into position separately, then let Astarion open."],"opener":["Turn 1, Bonus Action: Hunter's Mark on the most dangerous single target (or skip it if you are opening with Volley — see note).","Turn 1, Action: if 3 or more enemies are within a radius, VOLLEY. Otherwise attack twice with the longbow.","Horde Breaker fires automatically on your first attack if a second enemy is adjacent to your target — no button, it just happens once per turn.","Make sure Sharpshooter is TOGGLED ON before you shoot. Check the toggle every fight; it does not persist reliably through reloads.","Have the familiar use Help on an adjacent ally for advantage if it has nothing better to do."],"sustain":["Action: 2 longbow attacks (Extra Attack), plus the free Horde Breaker attack on a second adjacent enemy.","Bonus Action: re-cast Hunter's Mark on a new target when the marked one dies (this is free targeting, not a new slot, once the target dies).","Movement: stay at range and stay elevated. Never end your turn within reach of a melee enemy.","Toggle Sharpshooter OFF against high-AC targets — if you are missing more than half your shots, the -5 is costing you damage, not adding it.","Switch to Volley the moment 3+ enemies cluster, then back to normal attacks when they spread."],"panic":["Melee has reached you: Bonus Action Misty Step (Amulet of Misty Step) to a ledge, then shoot. This does not provoke opportunity attacks.","No Misty Step available: Disengage (Action) and walk out — Escape the Horde gives enemies disadvantage on opportunity attacks against you anyway.","Multiple enemies incoming down a lane: cast Spike Growth across the lane. They take damage per metre and are slowed to a crawl.","One dangerous melee enemy: Ensnaring Strike to Restrain it. Note this REPLACES Hunter's Mark as your Concentration.","Enemy casters ruining you: Silence centred on the caster group. No saving throw, no spells.","Low HP: drink a potion (Bonus Action) or retreat behind the Paladin and let Shadowheart's Healing Word reach you."],"notes":["VOLLEY vs NORMAL ATTACKS: Volley replaces your attack Action, so it is Volley OR (2 attacks + Horde Breaker). Volley wins at 3+ targets, loses at 1-2. Do the count before you click.","Volley does not proc Horde Breaker and only applies Hunter's Mark to the marked target — but every Volley hit is a real attack roll, so Sharpshooter, Gloves of Archery, Strange Conduit, and Callous Glow all apply to EVERY hit.","Conjure Barrage (levels 9-10) is a flat spell that ignores all your damage riders. It is a slot-burn for packed groups, not a rotation staple. Once Volley comes online at 11, Conjure Barrage is nearly retired.","ANALOGY BREAK: there is no 'spam'. Your damage per turn is fixed by your attack count. The way you increase DPS is by increasing accuracy (Bless, advantage, Archery style) so fewer attacks miss — not by attacking faster."]},{"characterId":"astarion","name":"Assassin Cross — Assassin Rogue 9 / Champion Fighter 3","preCombat":["Apply a weapon coating (Basic/Malefic/Drow Poison, or Oil of Sharpness) as a Bonus Action — do this OUT of combat so it does not cost you a turn.","Ungroup from the party and Hide (he has Stealth expertise; nobody else should be sneaking with him).","Move into flanking or backstab position BEFORE the fight starts. Position is worth more than any item on this character.","If the party has Pass Without Trace up (+10 Stealth), move the whole party into position for a Surprise round — Surprised enemies take AUTOMATIC CRITS from Assassinate."],"opener":["This is the whole build. Execute it correctly and the fight is usually decided in round one.","Alert guarantees he acts first. Assassinate grants ADVANTAGE against every creature that has not yet taken a turn — which on round one is all of them.","Action: main-hand attack. Sneak Attack applies automatically (5d6 at level 12) because you have advantage.","Action Surge (free, no action cost): a SECOND full Action — attack again. Note Sneak Attack has already been used this turn, so this hit is smaller.","Bonus Action: off-hand dagger attack (+DEX damage from Two-Weapon Fighting).","That is 3 attacks in round one, all with advantage, all with Champion's 19-20 crit range. Against a Surprised target every one of them is an automatic critical hit and the Sneak Attack dice double."],"sustain":["Rounds 2+, Assassinate is OFF (everything has acted). You now need advantage from another source to keep Sneak Attack online.","Source 1 — an ally within 1.5m of your target. If the Paladin is in melee with it, you get Sneak Attack with no extra work. This is the easiest and most reliable option.","Source 2 — Bonus Action: Hide (Cunning Action), then attack next turn with advantage. Costs you the off-hand attack.","Source 3 — attack a Prone target (Paladin's Trip Attack) or a Restrained target (main character's Ensnaring Strike).","Default sustain turn: Action attack + Bonus Action off-hand attack, standing next to the Paladin's target."],"panic":["Being focused: Uncanny Dodge (Reaction) halves the damage of one incoming attack. It is automatic-prompt — say yes to the biggest hit.","Surrounded: Bonus Action Disengage (Cunning Action) and move out. No opportunity attacks.","Low HP: Bonus Action Second Wind (from the Fighter dip) to self-heal, or a potion.","Caught in an AoE: Evasion (level 10) means a successful DEX save takes ZERO damage. Do not panic about fireballs.","Really bad: Bonus Action Hide, break line of sight, and let the fight come to the Paladin instead."],"notes":["SNEAK ATTACK FIRES ONCE PER TURN, not per attack. Extra attacks exist to give you more CHANCES to land it, not to stack it. This is the biggest break from Sonic Blow.","Sneak Attack in BG3 is a separate button (Sneak Attack: Melee) as well as an automatic rider — using the explicit button guarantees it applies to that specific hit. Use the button on your highest-advantage attack.","Action Surge recharges on a SHORT REST. Use it every meaningful fight. There is no reason to save it.","If you find yourself never getting the round-one alpha strike (walking into fights, losing initiative), the Assassin subclass is doing nothing for you — respec to Thief for a permanent second Bonus Action instead. That is a 100g fix, not a failure."]},{"characterId":"gale","name":"High Wizard — Evocation Wizard 12","preCombat":["AT CAMP EVERY MORNING: cast MAGE ARMOUR on himself. It lasts until Long Rest and is most of his AC. Forgetting it is the number one cause of dead Gales.","Re-check his PREPARED spell list before a known big fight — preparing is free outside combat, so tune it: more control for bosses, more AoE for mobs.","Scribe any new Wizard scrolls you have bought. This is permanent spellbook growth and it is his single best form of progression.","Take a Short Rest before the fight if his slots are low — Arcane Recovery returns slots once per short rest and there is no reason to hoard it.","Position him LAST and FAR. He has the worst HP and AC in the party. He should be the furthest character from the enemy when the fight starts."],"opener":["Count the enemies before you spend anything. Three or more clustered = AoE. One or two = save the slot and use Scorching Ray or a cantrip.","Turn 1 against a pack: FIREBALL (level 5+). Sculpt Spells means your own party takes zero damage from it, so aim at the middle of the scrum, not around it.","Turn 1 against a dangerous group you cannot burst: HYPNOTIC PATTERN instead. Incapacitating four enemies is worth more than damaging them.","Turn 1 before level 5: GREASE on the choke point, then ignite it with Fire Bolt. Cheap, and it does not need a big slot.","If an enemy caster is visible, hold your REACTION for Counterspell rather than spending it on anything else."],"sustain":["Default turn: cantrip (Fire Bolt) if the fight is already won, Scorching Ray if one target matters, AoE if three or more are still clustered.","WEB or ICE STORM to re-group enemies that have spread out, then AoE them next turn.","Feed HOLD PERSON / HOLD MONSTER to your Paladin — a paralysed target takes automatic critical hits from melee.","Reaction: SHIELD (+5 AC) when an attack would otherwise hit him, or COUNTERSPELL on an enemy cast. You only get one reaction per round, so decide which threat is worse.","Watch your Concentration. Web, Haste and Hypnotic Pattern all need it and only one can be active."],"panic":["Something reached him in melee: MISTY STEP (Bonus Action) out, or DIMENSION DOOR at level 7+. Do not try to walk away — you will eat an opportunity attack.","Being focused by ranged attacks: MIRROR IMAGE, or GREATER INVISIBILITY at level 7+. Enemies cannot target what they cannot see.","About to be hit by something big: SHIELD as a reaction for +5 AC — it is often enough to turn a hit into a miss after you have seen the roll.","Out of spell slots entirely: Arcane Recovery on a short rest. If you cannot rest, fall back to cantrips and stop trying to be the nuker that fight.","Party is losing: HYPNOTIC PATTERN to take half the enemies out of the fight, or GLOBE OF INVULNERABILITY at level 11+ over the clustered party."],"notes":["ANALOGY BREAK — THERE IS NO SP BAR. This is the hardest adjustment coming from an RO Wizard. You have a small fixed number of casts per Long Rest, not a regenerating pool. A level 5 Gale has roughly two Fireballs in him for the entire day. You cannot spam Storm Gust. Plan around spending big slots on the fight that matters and cantripping through the trash.","ANALOGY BREAK — YOUR AoE HITS YOUR OWN PARTY. In RO your Storm Gust never hurt your Priest. In BG3 a Fireball centred on a melee scrum damages your Paladin identically to the enemies. Evocation's SCULPT SPELLS (level 2) removes this for your evocation spells specifically — it is the entire reason this build picks Evocation, and until you have it, you must aim around your own people.","SURFACES PERSIST. Fire leaves burning ground, cold leaves ice that knocks people Prone, and both affect your party too. Sculpt Spells does NOT protect against the surface a spell leaves behind, only the initial damage.","SCROLLS ARE PERMANENT PROGRESSION. Every Wizard scroll you find or buy can be scribed into his spellbook forever. Buy them all. Gale's real power curve is your shopping habits, not his level-ups."]},{"characterId":"shadowheart","name":"High Priest — Life Domain Cleric 12","preCombat":["AT CAMP, EVERY MORNING — this is a checklist, run it every long rest:","1. Warding Bond on the Paladin (lasts until Long Rest, no Concentration). He takes half damage; she takes the other half.","2. Aid on the party (+5 max HP each, more at higher slots, lasts until Long Rest).","3. Death Ward on the Paladin and on Astarion (level 7+, survives one lethal hit, lasts until Long Rest).","4. Heroes' Feast (level 11+) for party-wide bonus HP and immunities.","5. Confirm she is carrying at least 3 Diamonds for Revivify.","Guidance before every out-of-combat skill check. It costs nothing. Just do it."],"opener":["Turn 1, Action: cast Spirit Guardians and walk INTO the enemy pack. It damages everything around her at the start of their turns and halves their movement.","Alternative turn 1 if the party needs accuracy more than she needs damage: cast Bless on the main character, Astarion, and the Paladin. Bless is +1d4 to attack rolls and saves for 3 allies.","YOU CANNOT DO BOTH — Bless and Spirit Guardians both need Concentration.","The workaround: equip Whispering Promise, then heal an ally for 1 HP with a Bonus Action Healing Word. That grants Bless via the ring WITHOUT using her Concentration, leaving Spirit Guardians up.","Turn 2, Action: cast Spiritual Weapon (a floating mace). It costs a slot once, needs no Concentration, and attacks as a Bonus Action for the rest of the fight."],"sustain":["Movement: walk her through the enemy formation. Spirit Guardians damages everything she passes and slows it.","Bonus Action: Spiritual Weapon attack (free damage, every single turn).","Action: Sacred Flame at range, or Guiding Bolt on a priority target (grants advantage to the next attacker — feed it to Astarion), or Hold Person on a dangerous humanoid.","Hold Person is the best thing she does offensively: a Paralysed humanoid takes AUTOMATIC CRITICAL HITS from every melee attack. Hold Person into Astarion's Sneak Attack is a delete button.","Reaction: with War Caster she can cast a spell as an opportunity attack instead of a weapon swing."],"panic":["An ally is DOWNED (on the floor, rolling death saves): Bonus Action Healing Word at range. 1 HP is enough to stand them up. This is the single most important button she has.","An ally actually DIED: Revivify (Action, consumes a Diamond).","Several allies badly hurt: Channel Divinity — Preserve Life. No spell slot, heals the party up to half max HP. Two charges per short rest from level 6.","Maximum emergency: Beacon of Hope first (all healing maximised), then Preserve Life. This is the wipe-preventer.","SHE is being focused: cast Sanctuary on herself — enemies must pass a save to even target her, and it breaks only if she attacks. She can still heal and buff under Sanctuary.","One enemy is too strong: Banishment (level 7+). On a failed CHA save it leaves the fight entirely."],"notes":["WARDING BOND IS A DAMAGE SPLIT, NOT A REDUCTION. If the Paladin takes 40, he takes 20 and she takes 20. The build wins because she has high CON, the Amulet of Greater Health (CON 23), anti-crit armour, and Blessed Healer feeding her HP back — not because the damage disappears.","If she is dying to Warding Bond, that is a signal to fix HER defences, not to drop the bond.","HEALING IS WEAK IN BG3. Do not spend Actions topping people off. Spend Actions on Spirit Guardians damage and control; spend BONUS Actions on Healing Word to pick people up off the floor. Prevention beats healing by a wide margin here — this is a real departure from RO Full Support.","Prepared spells can be swapped for free outside combat. Re-tune her list before big fights: more control for boss fights, more healing for attrition fights."]},{"characterId":"paladin","name":"Crusader — Oath of the Ancients 9 / Battle Master Fighter 3","preCombat":["Drink an Elixir of Hill Giant Strength (sets STR to 21, lasts until Long Rest). Do this every morning at camp.","Confirm Shadowheart has Warding Bond on him and Death Ward up.","Identify the CHOKEPOINT before the fight starts — a doorway, a bridge, a narrow ledge, the top of a staircase. Your entire value is standing in it.","Confirm he is holding a glaive or halberd, not a greatsword. Polearm Master does nothing with the wrong weapon."],"opener":["Turn 1, Movement or Bonus Action: Misty Step (free from the Ancients oath) directly into the chokepoint. This is faster and safer than walking.","Turn 1, Action: attack twice (Extra Attack). Use GOADING ATTACK (Battle Master maneuver) on one of them — the target gets disadvantage attacking anyone but you.","Bonus Action: Polearm Master butt-end attack (1d4 + STR). That is 3 attacks on turn one.","Alternative turn 1 against a single dangerous enemy: cast Compelled Duel (Action) instead — it stops the target moving away from you and gives it disadvantage against everyone else. It is a WIS save, so use it on low-WIS bruisers, not on casters.","If several enemies are clumped: Channel Oath — Nature's Wrath to Restrain them in place."],"sustain":["Stand still. Do not chase. The whole point is that enemies have to come to you and cannot get past.","Action: 2 attacks. Add a maneuver when it is worth a Superiority Die — Trip Attack to knock something Prone (everyone then hits it with advantage), Goading Attack to redirect a new arrival.","Bonus Action: Polearm Master butt-end attack, every single turn, for free.","Reaction — this is where the build actually lives. Polearm Master gives you an opportunity attack when an enemy ENTERS your reach. If that attack hits, Sentinel sets its speed to ZERO. It is now stuck 3 metres away from your squishies, unable to advance.","Reaction alternative: Riposte when an enemy misses you, or Sentinel's free attack when something swings at an ally within your reach.","DIVINE SMITE DISCIPLINE: only smite on CRITICAL HITS (the dice double) or to finish a dangerous enemy. Smiting every hit empties your slots by round three."],"panic":["Low HP: Lay on Hands (Bonus Action pool of healing — he heals himself and it also cures disease/poison).","Still low: Second Wind (Bonus Action, from the Fighter dip, recharges on a short rest).","Getting overwhelmed at the chokepoint: Action Surge for two extra attacks to clear the pressure, or use it to Dash out and re-establish somewhere better.","The line has broken and enemies are past you: Misty Step behind them, or Compelled Duel the fastest one to drag it back.","Enemy caster is nuking the clustered party: your Aura of Warding (level 10) already halves it — move TOWARD the party, not away, so everyone is inside the radius.","About to die with allies down: Channel Oath, or just accept a downed turn — Shadowheart's Healing Word is a Bonus Action and she can pick you up from across the map."],"notes":["THE LOCKDOWN COMBO, IN ORDER: enemy walks toward your party → it enters your 3m glaive reach → Polearm Master grants you an opportunity attack → the hit triggers Sentinel → its movement drops to 0 for the rest of its turn → it is stranded in front of you. Repeat for every enemy that tries to walk past. This is the closest BG3 has to a hard taunt.","ANALOGY BREAK — PROVOKE IS NOT A TAUNT. Compelled Duel and Goading Attack both allow saving throws and both only impose DISADVANTAGE on attacking others; a determined enemy can still ignore you and hit your archer. BG3 has no forced-target mechanic at all. You control enemies with geometry (chokepoints, reach, Sentinel) far more than with 'taunt' abilities. If you try to play this like RO Provoke you will be disappointed.","ANALOGY BREAK — DEVOTION IS INVERTED. In RO the Crusader casts Devotion outward onto others. Here he RECEIVES Warding Bond from Shadowheart. He is the protected one, not the protector, in that specific mechanic.","Positioning priority when you cannot have everything: (1) block the lane to Shadowheart and the main character, (2) stay within aura range of the party, (3) deal damage. Damage is third."]}]},"checklist":{"meta":{"startingPoint":"Written from your stated current state: party level 2, early Act 1, Astarion and Shadowheart recruited but unmodified, 4th slot empty. If you are further along, skip to the first task that is still undone — nothing here breaks if done late except the items marked MISSABLE.","respecCost":"Withers charges 100 gold per respec, every time, for any character including yourself. He must be recruited first (see task 1). There is no limit on how many times you respec.","pointOfNoReturn":"You can walk back to Act 1 zones during Act 2. You CANNOT return to Acts 1 or 2 once you travel to Act 3 (Rivington). Finish every Act 1 and Act 2 item on this list before that transition."},"tasks":[{"id":1,"order":1,"task":"Recruit Withers from the Dank Crypt","characterId":"party","act":1,"cost":"Free","warning":"Nothing else on this list works until he is at camp, and the Shadowheart respec is time-sensitive. Do this before you walk north to find Lae'zel.","detail":"The ornate stone door in the Overgrown Ruins, right by the Ravaged Beach (the door Shadowheart stands at if you did not free her on the nautiloid), leads down into the Dank Crypt. Explore to the back and open the sarcophagus — Withers is inside. He then appears at camp permanently. He provides respecs (100g), resurrection (200g), and hireling recruitment (100g each), and he is the single most important 'vendor' in the game for a build-focused playthrough.","done":false},{"id":2,"order":2,"task":"Respec Shadowheart from Trickery to LIFE DOMAIN","characterId":"shadowheart","act":1,"cost":"100 gold","warning":"Shadowheart arrives PRE-BUILT as Trickery. Cleric subclass is chosen at level 1 in BG3, and hers was set before you met her — so no level-up screen will ever offer you a domain menu for her. Withers is the only route, and he only trades at CAMP, not out in the world.","detail":"DO NOT HOLD HER LEVELS WAITING FOR THIS. Levelling her normally in the meantime costs you nothing — the respec rebuilds from level 1 regardless of what level she is when you do it, so a held level is pure lost power now for zero benefit later. Nothing she picks before the respec is a commitment either: her level 2 is fully automatic, and Clerics PREPARE spells, so any spell list she takes can be rewritten for free outside combat. The domain was the only locked thing and it is already locked. The only real cost of delaying is clicking — you re-make every level's choices in one sitting, which is a minute at level 3 and tedious at level 10. COST IS FLAT: respec is 100 gold at any level. It resets her to level 1, you rebuild everything, then re-level straight back up in one sitting. She keeps all equipment and story progress, and nothing is permanently wasted by waiting — so if you are short of gold right now, doing this on a later camp visit costs you nothing but time playing a weaker character. On respec pick: Domain LIFE. Cantrips Guidance, Sacred Flame, Resistance. Ability array STR 10 / DEX 14 / CON 15 / INT 8 / WIS 15 / CHA 8, then Half-Elf bonuses +2 CHA (forced) +1 CON +1 WIS. Prepared: Healing Word, Guiding Bolt, Command, Sanctuary (Bless is free from the domain).","done":false},{"id":3,"order":3,"task":"Respec Astarion to fix his ability array (keep him Rogue)","characterId":"astarion","act":1,"cost":"100 gold","warning":"Optional but recommended now — his default spread wastes points, and respeccing later means re-picking more choices.","detail":"Array STR 8 / DEX 15 / CON 15 / INT 8 / WIS 14 / CHA 10, then High Elf +2 DEX +1 INT. Expertise: Stealth + Sleight of Hand. He stays Rogue — you pick Assassin at level 3, not now.","done":false},{"id":4,"order":4,"task":"Decide and recruit your 4th slot (the Paladin body)","characterId":"paladin","act":1,"cost":"Free (companion) or 100 gold (hireling)","warning":"IRREVERSIBLE RECRUITMENT DECISIONS. At Lae'zel's cage the dialogue offers a branch where you side with the tieflings against her — taking it loses her permanently. Persuade them to leave, or fight them, then free the cage yourself.","detail":"RECOMMENDED — LAE'ZEL (Githyanki, +2 STR, best racial fit). DIRECTIONS FROM THE RAVAGED BEACH: head north-east and uphill, away from the water. Pass the Overgrown Ruins door, reach the Roadside Cliffs waypoint (Gale is here as a hand sticking out of a rune-covered rock — interact or you walk past him), then keep following the road. Lae'zel is in a cage strung between two trees on raised ground just off the path, guarded by two tieflings. If you hit the goblin-vs-tiefling fight at the Emerald Grove front gate, you have gone slightly too far. TWO BONUSES: Githyanki get Misty Step as a free racial cast around level 5, which stacks with the Ancients oath Misty Step for two slot-free teleports per rest; and her questline routes you to the Creche at Rosymorn Monastery, where the missable Blood of Lathander is (task 14). ALTERNATIVES: (b) Karlach on the Risen Road — great character, no STR racial. (c) A Withers hireling for 100g — no story, fully custom stats. AVOID MINTHARA for this build: recruiting her in Act 1 requires sacking the Emerald Grove, which is close to a textbook Oath of the Ancients break, and it permanently loses Halsin, Wyll, and the tiefling questlines.","done":false},{"id":31,"order":4.5,"task":"Recruit Gale from the Roadside Cliffs","characterId":"gale","act":1,"cost":"Free","warning":"Easy to walk straight past. He is not a person standing in the open — he is a HAND sticking out of a rune-covered rock at the Roadside Cliffs waypoint, on the road between the beach and Lae'zel's cage. Interact with the hand.","detail":"You pass this on the way to Lae'zel, so grab him in the same trip. GALE'S MAINTENANCE COST: early on he needs to consume magical items periodically or his condition destabilises — when he asks, feed him a magic item you do not need. It resolves after a few instances in Act 1. Do not ignore the prompts. He does NOT need a respec: his subclass is not chosen until level 2, so nothing is locked wrongly yet.","done":false},{"id":32,"order":6.5,"task":"Pick Evocation for Gale at level 2 and sort the party swap","characterId":"gale","act":1,"cost":"Free","warning":"Evocation is Gale's one irreversible pick (100g to change). Choosing anything else means your Fireballs will damage your own Paladin.","detail":"Sculpt Spells makes allies take ZERO damage from your evocation AoE — this is what lets you drop Fireball onto a melee scrum. PARTY SLOTS: you have five builds for four seats. Recommended active four is Main + Gale + Shadowheart + Paladin, with Astarion benched. Swapping at camp is free and benched companions still gain XP, so keep Astarion levelled and swap him in for lock-heavy or heavily trapped areas. Teach Gale KNOCK to cover most of what you lose.","done":false},{"id":5,"order":5,"task":"Respec your 4th slot to Oath of the Ancients Paladin","characterId":"paladin","act":1,"cost":"100 gold","warning":"Paladin Oath is chosen at LEVEL 1 in BG3 (unlike tabletop). Breaking the Oath later turns them into an Oathbreaker and costs 1000g+ to restore.","detail":"Array STR 15 / DEX 10 / CON 14 / INT 8 / WIS 10 / CHA 14 plus racial to STR. Oath: ANCIENTS. Ancients tenets to avoid breaking: no cruelty, no killing surrendered or helpless creatures, no wanton destruction of nature, no betraying innocents.","done":false},{"id":6,"order":6,"task":"Level everyone to 3 and lock in the subclasses","characterId":"party","act":1,"cost":"Free","warning":"Three subclass locks happen at once here. Each costs 100g to undo.","detail":"Main: Hunter subclass, then Hunter's Prey = HORDE BREAKER. Astarion: ASSASSIN. Shadowheart: no choice (Channel Divinity is automatic). Paladin: no choice (Channel Oath is automatic).","done":false},{"id":7,"order":7,"task":"Buy Gloves of Archery and stock up on poison coatings","characterId":"main","act":1,"cost":"~200-400 gold","warning":null,"detail":"Arron in the Emerald Grove is the main early vendor. Gloves of Archery (+2 ranged damage) for the main character; Basic and Malefic poison coatings for Astarion; every Diamond in stock for Shadowheart's Revivify. Vendors restock after each Long Rest.","done":false},{"id":8,"order":8,"task":"Resolve the Emerald Grove — save the tieflings, get Hellrider's Pride","characterId":"shadowheart","act":1,"cost":"Free","warning":"MAJOR IRREVERSIBLE STORY FORK. Siding with the goblins destroys the Grove, permanently loses Wyll, Karlach's questline, Halsin, and the tiefling vendors — and would likely break your Paladin's Ancients Oath. Take the save-the-Grove path.","detail":"Zevlor rewards you with Hellrider's Pride gloves (creatures you heal gain Blade Ward). This is a core Shadowheart item.","done":false},{"id":9,"order":9,"task":"Auntie Ethel — take the Hag's Hair and put it in the MAIN CHARACTER's DEXTERITY","characterId":"main","act":1,"cost":"Free","warning":"IRREVERSIBLE AND ONE PER PLAYTHROUGH. If you give this to a companion or spend it on a different stat, your level 8 feat lands on DEX 19 instead of 20 — the same modifier as 18, i.e. a completely wasted feat.","detail":"Sussur Bog, Auntie Ethel's teahouse. DEX 17 becomes 18, so the level 8 Ability Improvement takes you to 20. This is the single most important one-time item decision in your Act 1.","done":false},{"id":10,"order":10,"task":"Level 4 feats — Sharpshooter and Alert","characterId":"party","act":1,"cost":"Free","warning":null,"detail":"Main character: SHARPSHOOTER. Astarion: ALERT (his Assassinate needs him to win initiative — do not delay this). Shadowheart: WAR CASTER. Paladin: SENTINEL.","done":false},{"id":11,"order":11,"task":"Zhentarim Hideout — buy the Titanstring Bow and Hill Giant Strength elixirs","characterId":"main","act":1,"cost":"~500-800 gold","warning":"The Zhentarim can be turned hostile by earlier choices in the Waukeen's Rest / Rescue-the-Zhent questline. If Brem is dead you lose this vendor permanently.","detail":"Titanstring Bow adds your STR modifier to ranged damage. At STR 8 that is -1, so it is only good WITH a Hill Giant Strength source. Buy elixirs at the same time. If juggling elixirs annoys you, skip Titanstring and wait for The Dead Shot in Act 2 — that is a legitimate simplification.","done":false},{"id":12,"order":12,"task":"Underdark — Myconid Colony questline for the Strange Conduit Ring","characterId":"main","act":1,"cost":"Free","warning":"MISSABLE if you skip the Underdark entirely or side against the myconids.","detail":"+1d4 psychic damage while Concentrating — and you Concentrate on Hunter's Mark permanently, so it is +1d4 on every arrow. Also pick up the Amulet of Misty Step in this region.","done":false},{"id":13,"order":13,"task":"Grymforge — Adamantine Forge, spend your Mithral Ore","characterId":"party","act":1,"cost":"Free (limited Mithral Ore)","warning":"ONE-TIME LIMITED RESOURCE. You can typically only forge 2 items in the whole game because Mithral Ore is that scarce. Choose deliberately.","detail":"Recommended: Adamantine SCALE MAIL for Shadowheart (medium armour, no STR requirement, cannot be critically hit — critical for the Warding Bond carrier) and Adamantine SPLINT ARMOUR for the Paladin (AC 18, cannot be critically hit). Skip the shield — your Paladin is two-handed.","done":false},{"id":14,"order":14,"task":"Rosymorn Monastery — get The Blood of Lathander BEFORE leaving Act 1","characterId":"shadowheart","act":1,"cost":"Free","warning":"MISSABLE. Only reachable via the Mountain Pass / Githyanki Creche route. If you go to Act 2 through the Underdark and never come back, it is gone.","detail":"Legendary mace: +1d4 radiant, casts Sunbeam, and once per rest it revives the entire party at 1 HP instead of letting someone die. Solve the sunlight-and-mural puzzle at the top of the monastery.","done":false},{"id":15,"order":15,"task":"Level 5 — the biggest power spike in the game","characterId":"party","act":1,"cost":"Free","warning":null,"detail":"Main: Extra Attack + Spike Growth. Astarion: FIGHTER 1 multiclass dip, Two-Weapon Fighting (do not autopilot into Rogue 5). Shadowheart: SPIRIT GUARDIANS — her whole playstyle changes here. Paladin: Extra Attack, and Misty Step becomes available from the oath.","done":false},{"id":16,"order":16,"task":"Start the camp buff routine every Long Rest","characterId":"shadowheart","act":1,"cost":"Free (spell slots)","warning":null,"detail":"Every single morning: Warding Bond on the Paladin, Aid on the party, Longstrider on the party (main character), Hill Giant Strength elixir for the Paladin, and later Death Ward and Heroes' Feast. This routine is worth more than most items.","done":false},{"id":17,"order":17,"task":"Astarion's Fighter dip completes — Action Surge and Champion","characterId":"astarion","act":1,"cost":"Free","warning":"Champion is a subclass lock (100g to undo). Also: at character level 8 you must switch BACK to Rogue.","detail":"Character level 6 = Fighter 2 (Action Surge). Character level 7 = Fighter 3, pick CHAMPION. Character level 8 onward = Rogue again, all the way to Rogue 9.","done":false},{"id":18,"order":18,"task":"Sweep every remaining Act 1 vendor before crossing into Act 2","characterId":"party","act":1,"cost":"All your gold","warning":"SOFT POINT OF NO RETURN. You can technically walk back to Act 1 during Act 2, but it is a long trip and easy to forget. Clear the list now.","detail":"Confirm you have: Hag's Hair spent on main DEX, Hellrider's Pride, Whispering Promise, Strange Conduit Ring, Amulet of Misty Step, both Adamantine items forged, Blood of Lathander, a stack of Diamonds, and a stack of poison coatings and Hill Giant Strength elixirs.","done":false},{"id":19,"order":19,"task":"Act 2 — Last Light Inn vendors, The Dead Shot and Cloak of Protection","characterId":"main","act":2,"cost":"~1000 gold","warning":"Last Light Inn can be destroyed by story events later in Act 2. Shop there EARLY, not late.","detail":"The Dead Shot (longbow with bonus to hit — offsets Sharpshooter's -5), Cloak of Protection, Boots of Stormy Clamour for Shadowheart, Callous Glow Ring.","done":false},{"id":20,"order":20,"task":"Moonrise Towers — Araj Oblodra and the Risky Ring","characterId":"main","act":2,"cost":"Story cost, not gold","warning":"CONDITIONAL AND MISSABLE. She only trades the ring if Astarion agrees to let her drink his blood. This has an approval and story consequence with Astarion — read the dialogue before you commit.","detail":"Risky Ring grants ADVANTAGE ON ALL ATTACK ROLLS with disadvantage on saves. On a Sharpshooter build, permanent advantage is close to the best item in the game — and the Paladin's Aura of Protection plus Bless largely covers the save penalty.","done":false},{"id":21,"order":21,"task":"Gauntlet of Shar — Shadowheart's questline and Dark Justiciar gear","characterId":"shadowheart","act":2,"cost":"Free","warning":"MAJOR IRREVERSIBLE STORY FORK for Shadowheart at the end of this questline. It affects her available gear, her personal arc, and later the Mirror of Loss interaction in Act 3.","detail":"Compare Dark Justiciar Half-Plate against Adamantine Scale Mail before swapping — the 'cannot be critically hit' clause is often still better on the Warding Bond carrier.","done":false},{"id":22,"order":22,"task":"Level 8 feats","characterId":"party","act":2,"cost":"Free","warning":null,"detail":"Main: Ability Improvement +2 DEX (18 to 20 — this only works if the Hag's Hair went into DEX). Astarion: this is Rogue 5, no feat yet. Shadowheart: +2 WIS. Paladin: this is Fighter 2, no feat yet.","done":false},{"id":23,"order":23,"task":"Paladin Fighter dip completes — Battle Master maneuvers","characterId":"paladin","act":2,"cost":"Free","warning":"Battle Master is a subclass lock. Also remember to switch back to Paladin at character level 10.","detail":"Character level 7 = Fighter 1 (Defence style). Level 8 = Fighter 2 (Action Surge). Level 9 = Fighter 3, BATTLE MASTER, maneuvers = GOADING ATTACK, TRIP ATTACK, RIPOSTE. Level 10 onward = Paladin again.","done":false},{"id":24,"order":24,"task":"Finish all Act 2 business — HARD POINT OF NO RETURN AHEAD","characterId":"party","act":2,"cost":"Free","warning":"ONCE YOU TRAVEL TO ACT 3 (RIVINGTON) YOU CAN NEVER RETURN TO ACT 1 OR ACT 2. Every unbought item, unfinished companion quest, and unlooted area is permanently gone.","detail":"Final Act 2 sweep: all vendors emptied, all companion quests advanced, Gauntlet of Shar complete, Risky Ring decided, and everyone at level 9-10.","done":false},{"id":25,"order":25,"task":"Level 11 — Volley and Polearm Master come online","characterId":"party","act":3,"cost":"Free","warning":null,"detail":"Main: Hunter Multiattack = VOLLEY (not Whirlwind Attack — that is the melee version). Astarion: Rogue 8 feat = +2 DEX. Shadowheart: 6th-level spells, Heroes' Feast. Paladin: Paladin 8 feat = POLEARM MASTER (confirm he is holding a glaive or halberd first).","done":false},{"id":26,"order":26,"task":"Act 3 — Raphael's House of Hope heist","characterId":"party","act":3,"cost":"Ritual components from Helsik (~2000 gold)","warning":"MISSABLE AS A BUNDLE. Skipping the House of Hope loses you Helldusk Armour, Gloves of Soul Catching, AND the Amulet of Greater Health in one go. This is the highest-value single location in the game.","detail":"Access via Helsik at the Devil's Fee in the Lower City (buy the ritual components) or via Raphael's deal path. Loot the vault. Amulet of Greater Health goes to SHADOWHEART (CON 23 fixes her Warding Bond survivability and her Concentration in one item), Helldusk Armour and Gloves of Soul Catching to the Paladin.","done":false},{"id":27,"order":27,"task":"Act 3 — Temple of Bhaal for Bhaalist Armour, Crimson Mischief and Bloodthirst","characterId":"astarion","act":3,"cost":"Free","warning":"Tied to the Orin / Murder Tribunal questline. Do not resolve Orin before looting the temple area.","detail":"Bhaalist Armour makes nearby enemies VULNERABLE to piercing damage — it doubles Astarion's dagger damage and his entire 5d6 Sneak Attack. Crimson Mischief and Bloodthirst are the piercing daggers that exploit it. This is his endgame package and it roughly doubles his output.","done":false},{"id":28,"order":28,"task":"Act 3 — Mirror of Loss beneath Sharess' Caress","characterId":"party","act":3,"cost":"Free","warning":"IRREVERSIBLE, once per character. STORY WARNING: using it has consequences for Shadowheart's personal arc depending on where her questline stands. Read the prompt carefully before letting her use it.","detail":"Permanent +2 to one ability score. Main character: DEX if not yet at 20, otherwise CON or WIS. Astarion: DEX (17+2 ASI = 19, +2 here = 21, breaking the normal cap). Paladin: CHA (bigger Aura of Protection for the whole party) or STR.","done":false},{"id":29,"order":29,"task":"Astarion's Ascension decision","characterId":"astarion","act":3,"cost":"Free","warning":"PERMANENT AND STORY-DEFINING. Ascending grants +2 to ALL ability scores and other combat bonuses — mechanically it is a large power increase. It is also the darker resolution of his arc and it changes his ending and his relationship outcomes. Decide on the story you want, not the stat line.","detail":"Mechanically: +2 to every stat is roughly two free feats. Narratively: it is the opposite of the redemption ending. There is no way to have both. This is flagged because it is the single biggest optional power decision left in the game and it is easy to stumble into during the ritual scene.","done":false},{"id":30,"order":30,"task":"Level 12 — final feats","characterId":"party","act":3,"cost":"Free","warning":"Level 12 is the cap. There is nothing after this.","detail":"Main: ALERT (or Lucky). Astarion: Rogue 9 for 5d6 Sneak Attack — or take Fighter 4 instead for a third feat, which is honestly the stronger option. Sh
